# note-search: node_id -> Notebook DS 1.0.1 registry_id
# Source: doc/идеи/f-v4-note-search/units/note-search/proto.json nodes[] (18 nodes, post-UI-review)
# Registry: design/registry.json @ ds/v1.0.1 (sha256:79d748c28c931af99fda53368d7217ac8ad1d838da7f99d5cd17104a7017c359, 14 entries)
# Rules:
#   * registry_id is a verbatim id from design/registry.json — nothing invented.
#   * composition: node assembled from existing primitives; registry_id null unless the node
#     maps 1:1 to a registry pattern (n-offline -> patterns/note-item).
#   * path6_required: no DS registry match; tracked in design-gaps.json.
#   * No local CSS / no local_instances: nodes are styled by DS classes only.
schema_version: "1.0"
screen_id: note-search
unit_id: note-search
ds_release: "1.0.1"
ds_digest: "sha256:4e0ef1052a1401a928588445f921f7d231b7c0e7c9b10c181fdbbb439108c85e"
registry_sha256: "sha256:79d748c28c931af99fda53368d7217ac8ad1d838da7f99d5cd17104a7017c359"
proto_sha256: "sha256:ce496d1307b834954ceb877e9e221cfe6e6152d9f3da093247f1bd1c3671a59d"
proto_states: [normal, idle, results, no-results, empty, loading, error, offline, offline-zero]

nodes:
  # --- header ---
  n-notes-header:
    registry_id: patterns/notes-header
    selector: .notes-header

  # --- note creation (form composition) ---
  n-note-form:
    registry_id: null
    selector: .note-form
    composition: [primitives/textarea, primitives/button]
    proto_registry_id_rejected: patterns/note-form
    note: >-
      proto.json указывает registry_id patterns/note-form, но такого id нет в
      design/registry.json 1.0.1 (14 записей: primitives/*, patterns/*, states/*).
      Рекомендованная трактовка — композит primitives/textarea + primitives/button;
      registry id не присваивается, локального CSS нет.
  n-note-textarea:
    registry_id: primitives/textarea
    selector: textarea
    states: [default, focus, invalid]
  n-note-add:
    registry_id: primitives/button
    selector: '[data-testid="add-note"]'
    states: [default, hover, focus, disabled]

  # --- search ---
  n-search-field:
    registry_id: patterns/search-field
    selector: .notes-search
    composed_primitives: [primitives/input]
  n-search-clear:
    registry_id: patterns/search-clear
    selector: .notes-search-clear
  n-count:
    registry_id: null
    selector: '[data-testid="notes-search-count"]'
    path6_required: true
    design_gap: GAP-1
  n-delete:
    registry_id: null
    selector: .delete-note
    path6_required: true
    design_gap: GAP-3
    existing_css: web/app.css:248-257
    note: >-
      Registry omission: .delete-note (danger-вариант кнопки: transparent фон,
      border/color --danger, hover --danger-bg) есть в web/app.css, но отсутствует
      в design/registry.json 1.0.1. Registry id не присваивается; используется
      существующий DS-класс как есть, локального CSS нет.

  # --- states ---
  n-loading:
    registry_id: states/loading
    selector: '[data-testid="notes-loading"]'
    state: loading
  n-empty:
    registry_id: states/empty
    selector: '[data-testid="notes-empty"]'
    state: empty
  n-search-empty:
    registry_id: states/search-empty
    selector: '[data-testid="notes-search-empty"]'
    state: no-results
  n-error:
    registry_id: primitives/error
    selector: .error
    state: error
  n-retry:
    registry_id: primitives/button
    selector: '[data-testid="notes-retry"]'
    path6_resolution: reuse
    reused_registry_id: primitives/button

  # --- offline (composition, NOT a gap) ---
  n-offline:
    registry_id: patterns/note-item
    selector: '[data-testid="notes-offline"]'
    resolution: composition
    composition: [patterns/note-item, primitives/button]
    note: >-
      Баннер собран вторым вхождением patterns/note-item (.note-item) с muted-текстом
      (.muted) и кнопкой primitives/button. path6_required не ставится: DS-паттерн покрывает
      контейнер, отдельных локальных стилей нет.
  n-offline-check:
    registry_id: primitives/button
    selector: '[data-testid="notes-offline-check"]'
    path6_resolution: reuse
    reused_registry_id: primitives/button

  # --- list ---
  n-notes-list:
    registry_id: patterns/notes-list
    selector: .notes-list
  n-note-item:
    registry_id: patterns/note-item
    selector: .note-item
  n-button:
    registry_id: primitives/button
    selector: button
    states: [default, hover, focus, disabled]

summary:
  nodes_total: 18
  nodes_with_registry_id: 15
  composition_without_registry_id: 1
  composition_with_registry_id: 1
  path6_required: 2
  path6_resolved_by_reuse: 2
  registry_omissions: 1
  local_instances: 0
