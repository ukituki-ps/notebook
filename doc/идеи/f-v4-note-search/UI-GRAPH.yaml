# From-code actualization notes:
# - Auth is unchanged: login/register cards and links, login-success -> notes,
#   register-success -> login, 401/logout -> login.
# - notes-empty is reserved for a genuinely empty server list;
#   notes-search-empty is reserved for a non-empty query over a non-empty list.
# - Search is client-side over the loaded owner-scoped list; create/delete/
#   reload re-render through the single renderNotes()/filterNotes() path.
# - All 30 data-testid values are present in web/index.html exactly once; no
#   legacy ids (username, password, confirm-password, notes-form, note-text,
#   error, notes-card) remain.
# - note-item/delete-note live in <template id="note-item-template"> and are
#   cloned per note; notes-list is an empty container with no phantom rows.
