states:
  - id: idle-list
    label: "idle / list"
    page: notes
    required: true
    verified: true
    implementation: "web/app.js renderNotes(): notesList.hidden = visible.length === 0; notesEmpty.hidden = !noNotes; notesSearchClear.hidden = searchQuery === ''"
    detail: >-
      Trimmed query empty: all loaded notes are rendered (notes-list), or
      notes-empty when the loaded collection is genuinely empty.
      notes-search-empty hidden; notes-search-clear hidden while the raw query
      is empty (a whitespace-only raw query leaves Clear visible). Create form
      and search remain usable once the list has loaded.
  - id: filtering
    label: "filtering"
    page: notes
    required: true
    verified: true
    implementation: "web/app.js filterNotes()/renderNotes(); notesSearch 'input' handler"
    detail: >-
      Trimmed query non-empty: the loaded owner-scoped list is filtered
      client-side by case-insensitive substring over title+text; non-matching
      rows are not rendered; no per-keystroke request is made.
  - id: results
    label: "results"
    page: notes
    required: true
    verified: true
    implementation: "web/app.js renderNotes(): visible.length > 0"
    detail: >-
      Filtering yields >= 1 match: notes-list visible with the matching
      note-item rows; notes-search-empty hidden; notes-empty hidden.
  - id: search-empty
    label: "search-empty"
    page: notes
    required: true
    verified: true
    implementation: "web/app.js renderNotes(): notesSearchEmpty.hidden = !(hasQuery && !noNotes && visible.length === 0)"
    detail: >-
      Filtering yields 0 matches while the loaded collection is non-empty:
      notes-search-empty visible with "Ничего не найдено.", no note-item
      visible, notes-list hidden, notes-empty hidden; search input and create
      form remain usable.
  - id: genuinely-empty
    label: "genuinely empty"
    page: notes
    required: true
    verified: true
    implementation: "web/app.js renderNotes(): notesEmpty.hidden = !noNotes; loadNotes() sets notes from the GET 200 array"
    detail: >-
      GET /api/notes returns 200 [] with an empty query: notes-empty visible,
      notes-list hidden, notes-search-empty hidden (reserved for a non-empty
      query).
  - id: loading
    label: "loading"
    page: notes
    required: true
    verified: true
    implementation: "web/app.js loadNotes(): notesLoading.hidden = false; notesEmpty/notesList/searchEmpty hidden; setNotesEnabled(false)"
    detail: >-
      Initial list load in progress: notes-loading visible;
      notes-list/notes-empty/notes-search-empty hidden; note-form and search
      controls disabled until the list is loaded.
  - id: error
    label: "error"
    page: notes
    required: true
    verified: true
    implementation: "web/app.js loadNotes() non-200/network path; POST/DELETE error paths reuse notes-error"
    detail: >-
      GET != 200 or network error: notes-error visible with the existing f-v3
      message; after a failed initial GET the list/search controls remain
      disabled until a successful reload. POST/DELETE failures reuse the same
      error region and keep the already loaded search usable.
  - id: unauthorized
    label: "unauthorized / session expired"
    page: notes
    required: true
    verified: true
    implementation: "web/app.js handleUnauthorized()/logout handler"
    detail: >-
      401 or missing token: clear notebook.token/user (and the saved search);
      notes-error shows "Сессия истекла...", controls are disabled, then the
      app navigates to /login (unchanged from f-v3).
  - id: auth-screens
    label: "auth screens"
    pages:
      - login
      - register
    required: true
    verified: true
    implementation: "web/app.js activate()/wireLink(); login and register submit handlers"
    detail: >-
      login/register cards, forms, error lines and cross-links:
      login has register-link -> /register; register has login-link -> /login.
      login-success -> /notes; register-success -> /login.
  - id: search-state-machine
    label: "search state machine"
    page: notes
    required: true
    kind: transition
    verified: true
    implementation: "web/app.js renderNotes() is the single re-render/filter path for load/create/delete; sessionStorage notebook.search restores the query"
    detail: >-
      idle-list --(trimmed q non-empty)--> filtering --> results | search-empty
      --> clear/empty query --> idle-list. create/delete/reload while filtering
      re-applies the same filter; reload restores the saved query from
      sessionStorage and re-applies it to the freshly loaded list.
state_machine:
  page: notes
  initial: idle-list
  render_states:
    - idle-list
    - filtering
    - results
    - search-empty
  transitions:
    - from: idle-list
      to: filtering
      on: "input event: searchQuery.trim() !== ''"
    - from: filtering
      to: results
      guard: "visible.length > 0"
    - from: filtering
      to: search-empty
      guard: "visible.length === 0 && notes.length > 0"
    - from: results
      to: idle-list
      on: "notes-search-clear click or input cleared/whitespace"
    - from: search-empty
      to: idle-list
      on: "notes-search-clear click or input cleared/whitespace"
    - from: "filtering|results|search-empty"
      to: "same state after re-render"
      on: "POST 201 / DELETE 204 / reload -> renderNotes() re-applies the active query"
  orthogonal_fetch_states:
    - loading
    - genuinely-empty
    - error
    - unauthorized
edges:
  - from: register
    to: login
    kind: navigation
    trigger: "register-success (201 -> sessionStorage notebook.prefill -> /login)"
  - from: login
    to: register
    kind: navigation
    trigger: "register-link click -> /register"
  - from: login
    to: notes
    kind: navigation
    trigger: "login-success (200 token -> localStorage notebook.token/user -> /notes)"
  - from: notes
    to: login
    kind: navigation
    trigger: "401-or-logout (clear notebook.token/user and saved search)"
  - from: notes
    to: notes
    kind: self-update
    trigger: "search-input: trimmed non-empty q filters the loaded list (no request)"
  - from: notes
    to: notes
    kind: self-update
    trigger: "search-clear: empty query restores the full loaded list"
  - from: notes
    to: notes
    kind: self-update
    trigger: "POST 201 / DELETE 204 with an active query re-applies the filter"
  - from: notes
    to: notes
    kind: self-update
    trigger: "reload: saved notebook.search query is restored and re-applied to the fresh list"
