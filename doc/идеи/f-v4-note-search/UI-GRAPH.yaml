# UI-граф (planned) — f-v4-note-search, экран note-search
# Источник: s04.graph_builder_design (E0809, from-design) по:
#   visualized-brief.md, scope-report.md, design-impact.md, ds.lock.json,
#   component-refs.json, component-map.yaml, design-gaps.json,
#   prototypes/v6/manifest.json, prototypes/v6/prototype-review.json,
#   units/note-search/proto.json, web/index.html, web/app.js.
# Схема/стиль: arch/structure/ui-pages/UI-GRAPH.yaml (pages/components/edges),
# детализация узлов — как в arch/structure/ui-pages/notes.yaml (id/kind/label/selector).
# Это ПЛАНОВЫЙ граф (status: planned); актуализация по коду — на s21.
schema: ui-graph/v1
feature_id: f-v4-note-search
status: planned
platform: web
execution_id: E0809
step: s04.graph_builder_design
source: prototype
source_roots:
  - web
source_files:
  - web/index.html
  - web/app.js
  - web/app.css
pages:
  - id: note-search
    page_id: ui-page-note-search
    route: /
    screen_attr: notes
    screen: note-search
    status: planned
    source: prototype
    graph_ref: arch/frontend/pages/note-search.yaml
    page_file: arch/frontend/pages/note-search.yaml
    prototype: v6
    breakpoints: [390, 1200]
    source_files:
      - web/index.html
      - web/app.js
      - web/app.css

# Узлы экрана: 18 (page + 12 registry-backed/композиции + 2 path6 + 3 state-варианта
# сверх page/структуры + offline/retry). Каждый узел — из прототипа v6 (source: prototype).
nodes:
  - id: note-search
    kind: page
    label: "Экран поиска заметок (route /)"
    component: page
    registry_id: null
    selector: "[data-screen=notes]"
    states: [idle, results, no-results, empty, loading, error, offline]
    source: prototype

  - id: n-notes-header
    kind: header
    label: "Шапка (Notebook, username, Logout)"
    component: patterns/notes-header
    registry_id: patterns/notes-header
    selector: ".notes-header"
    states: [default]
    source: prototype

  - id: n-note-form
    kind: form
    label: "Новая заметка"
    component: composition
    registry_id: null
    composition: [primitives/textarea, primitives/button]
    selector: ".note-form"
    states: [default, focus, invalid]
    source: prototype

  - id: n-note-textarea
    kind: textarea
    label: "Текст заметки"
    component: primitives/textarea
    registry_id: primitives/textarea
    selector: "textarea"
    states: [default, focus, invalid]
    source: prototype

  - id: n-note-add
    kind: button
    label: "Add"
    component: primitives/button
    registry_id: primitives/button
    selector: "[data-testid=add-note]"
    states: [default, hover, focus, disabled]
    source: prototype

  - id: n-search-field
    kind: input
    label: "Поиск заметок"
    component: patterns/search-field
    registry_id: patterns/search-field
    composed_primitives: [primitives/input]
    selector: ".notes-search"
    states: [default, focus, disabled]
    design_gap: GAP-2
    source: prototype

  - id: n-search-clear
    kind: button
    label: "Очистить поиск (Clear)"
    component: patterns/search-clear
    registry_id: patterns/search-clear
    selector: ".notes-search-clear"
    states: [default, focus]
    source: prototype

  - id: n-count
    kind: text
    label: "Найдено N"
    component: null
    registry_id: null
    path6: true
    design_gap: GAP-1
    selector: "[data-testid=notes-search-count]"
    states: [visible, zero, hidden]
    source: prototype

  - id: n-notes-list
    kind: list
    label: "Список заметок (role=list)"
    component: patterns/notes-list
    registry_id: patterns/notes-list
    selector: ".notes-list"
    states: [default, busy]
    source: prototype

  - id: n-note-item
    kind: list-item
    label: "Заметка: #<id> <text> (role=listitem)"
    component: patterns/note-item
    registry_id: patterns/note-item
    selector: ".note-item"
    states: [default, pending]
    source: prototype

  - id: n-note-text
    kind: text
    label: "#<id> <text>"
    component: null
    registry_id: null
    selector: ".note-text"
    states: [default]
    source: prototype

  - id: n-delete
    kind: button
    label: "Delete (aria-label=«Удалить заметку #<id>»)"
    component: null
    registry_id: null
    path6: true
    design_gap: GAP-3
    selector: ".delete-note"
    existing_css: "web/app.css:248-257"
    states: [default, hover, focus, disabled]
    source: prototype

  - id: n-loading
    kind: state
    label: "Загрузка..."
    component: states/loading
    registry_id: states/loading
    selector: "[data-testid=notes-loading]"
    states: [loading]
    source: prototype

  - id: n-empty
    kind: state
    label: "Пока нет заметок. Добавьте первую выше."
    component: states/empty
    registry_id: states/empty
    selector: "[data-testid=notes-empty]"
    states: [empty]
    source: prototype

  - id: n-search-empty
    kind: state
    label: "Ничего не найдено. Сократите запрос или очистите поиск."
    component: states/search-empty
    registry_id: states/search-empty
    selector: "[data-testid=notes-search-empty]"
    states: [no-results]
    source: prototype

  - id: n-error
    kind: alert
    label: "Не удалось загрузить заметки. Попробуйте ещё раз."
    component: primitives/error
    registry_id: primitives/error
    selector: ".error"
    states: [error]
    source: prototype

  - id: n-offline
    kind: banner
    label: "Нет сети — показаны загруженные заметки."
    component: composition
    registry_id: patterns/note-item
    composition: [patterns/note-item, primitives/button]
    composition_note: >-
      Второе вхождение patterns/note-item с muted-текстом и кнопкой
      primitives/button «Проверить сеть» ([data-testid=notes-offline-check]);
      отдельный node для кнопки не выделяется — она часть композиции баннера.
    selector: "[data-testid=notes-offline]"
    states: [offline]
    source: prototype

  - id: n-retry
    kind: button
    label: "Повторить"
    component: primitives/button
    registry_id: primitives/button
    selector: "[data-testid=notes-retry]"
    states: [default, hover, focus, disabled]
    source: prototype

# Состояния экрана (state machine) — из units/note-search/proto.json.
# normal — алиас idle (8 имён, 7 рендерящихся состояний).
states:
  - id: normal
    alias_of: idle
    description: "Normal view (alias of idle): пустой запрос, список заметок."
  - id: idle
    description: "Пустой запрос: форма, поиск и все загруженные заметки; clear/count скрыты."
  - id: results
    description: "Непустой запрос с совпадениями: отфильтрованный список, clear и count видимы."
  - id: no-results
    description: "Непустой запрос без совпадений при непустой коллекции: search-empty, count=0, список скрыт."
  - id: empty
    description: "GET 200 [] при пустом запросе: notes-empty, список скрыт."
  - id: loading
    description: "Загрузка: notes-loading, поиск disabled, count/list скрыты."
  - id: error
    description: "Ошибка загрузки: notes-error + notes-retry, поиск disabled."
  - id: offline
    description: "Нет сети: offline-banner + кнопка «Проверить сеть», поиск disabled, загруженные заметки видны."

# Рёбра: contains (структура), renders (что показано), uses (DS-составляющие),
# state-transition (переходы состояния экрана).
# В state-transition узлы состояний адресуются как state-<id> (см. states ниже);
# state-any — любое состояние. uses-рёбра с to_kind=component/css/token
# ссылаются на registry id / DS-код / токен, а не на DOM-узел.
state_ref_prefix: "state-"
edges:
  # --- contains: структура экрана ---
  - from: note-search
    to: n-notes-header
    kind: contains
  - from: note-search
    to: n-note-form
    kind: contains
  - from: n-note-form
    to: n-note-textarea
    kind: contains
  - from: n-note-form
    to: n-note-add
    kind: contains
  - from: note-search
    to: n-search-field
    kind: contains
  - from: n-search-field
    to: n-search-clear
    kind: contains
    trigger: "clear видим, когда trimmed query непустой"
  - from: note-search
    to: n-notes-list
    kind: contains

  # --- renders: условный рендер ---
  - from: n-notes-list
    to: n-note-item
    kind: renders
    trigger: "по одному note-item на каждую видимую заметку"
  - from: n-note-item
    to: n-note-text
    kind: renders
    trigger: "текст строки #<id> <text>"
  - from: n-note-item
    to: n-delete
    kind: renders
    trigger: "кнопка удаления в каждой строке (idle/results/offline)"
  - from: note-search
    to: n-count
    kind: renders
    trigger: "count видим только в results/no-results; hidden в idle/normal/empty/loading/error/offline"
  - from: state-idle
    to: n-notes-list
    kind: renders
    trigger: "все загруженные заметки"
  - from: state-results
    to: n-notes-list
    kind: renders
    trigger: "только совпадающие заметки"
  - from: state-no-results
    to: n-search-empty
    kind: renders
    trigger: "role=status, aria-live=polite"
  - from: state-empty
    to: n-empty
    kind: renders
  - from: state-loading
    to: n-loading
    kind: renders
    trigger: "role=status, aria-live=polite; notes-list aria-busy=true"
  - from: state-error
    to: n-error
    kind: renders
    trigger: "role=alert"
  - from: state-error
    to: n-retry
    kind: renders
    trigger: "error -> retry"
  - from: state-offline
    to: n-offline
    kind: renders
    trigger: "offline -> banner"

  # --- uses: DS-составляющие (component/tokens/css) ---
  - from: n-note-form
    to: primitives/textarea
    kind: uses
    to_kind: component
  - from: n-note-form
    to: primitives/button
    kind: uses
    to_kind: component
  - from: n-search-field
    to: primitives/input
    kind: uses
    to_kind: component
    trigger: "input внутри .notes-search"
  - from: n-offline
    to: patterns/note-item
    kind: uses
    to_kind: component
    trigger: "баннер — второе вхождение note-item"
  - from: n-offline
    to: primitives/button
    kind: uses
    to_kind: component
    trigger: "«Проверить сеть» ([data-testid=notes-offline-check])"
  - from: n-retry
    to: primitives/button
    kind: uses
    to_kind: component
  - from: n-delete
    to: "web/app.css:248-257"
    kind: uses
    to_kind: css
    trigger: "path6 GAP-3: danger-вариант .delete-note уже в DS-коде, нет записи в registry"
  - from: n-count
    to: "design/tokens.json#--muted"
    kind: uses
    to_kind: token
    trigger: "path6 GAP-1: .muted на --card, скрытие через [hidden]"

  # --- state transitions ---
  - from: state-idle
    to: state-results
    kind: state-transition
    trigger: "input: непустой trimmed query, >=1 совпадение"
  - from: state-idle
    to: state-no-results
    kind: state-transition
    trigger: "input: непустой query, непустая коллекция, 0 совпадений"
  - from: state-results
    to: state-no-results
    kind: state-transition
    trigger: "запрос сужается до 0 совпадений"
  - from: state-no-results
    to: state-results
    kind: state-transition
    trigger: "запрос расширяется / появляются совпадения"
  - from: state-results
    to: state-idle
    kind: state-transition
    trigger: "click clear / пустой query"
  - from: state-no-results
    to: state-idle
    kind: state-transition
    trigger: "click clear / пустой query"
  - from: state-idle
    to: state-empty
    kind: state-transition
    trigger: "GET 200 [] при пустом query"
  - from: state-any
    to: state-loading
    kind: state-transition
    trigger: "старт загрузки/перезагрузки GET /api/notes"
  - from: state-loading
    to: state-idle
    kind: state-transition
    trigger: "GET 200 [..] при пустом query"
  - from: state-loading
    to: state-results
    kind: state-transition
    trigger: "GET 200 + восстановленный непустой query с совпадениями"
  - from: state-loading
    to: state-no-results
    kind: state-transition
    trigger: "GET 200 + восстановленный непустой query без совпадений"
  - from: state-loading
    to: state-empty
    kind: state-transition
    trigger: "GET 200 [] при пустом query"
  - from: state-loading
    to: state-error
    kind: state-transition
    trigger: "GET != 200 / network error"
  - from: state-error
    to: state-loading
    kind: state-transition
    trigger: "click [data-testid=notes-retry] -> повторный GET"
  - from: state-any
    to: state-offline
    kind: state-transition
    trigger: "network offline / fetch rejection"
  - from: state-offline
    to: state-idle
    kind: state-transition
    trigger: "сеть восстановлена -> загруженные заметки"

