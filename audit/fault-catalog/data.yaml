# Fault catalog — data (чтение/пагинация/скоуп/деривация)
- id: DATA-ADAPTER-REAL-TRANSPORT
  domain: data
  title: "Контрактный тест мокает сам юнит под тестом → маскирует баг адаптера"
  detect: "cd nexus-ui && npx vitest run src/__tests__/bugs-log.test.tsx"
  severity: high
  canary_ref: "audit/canaries/seeds/ui-wire-casing"
  source: "F186 E8181: bugs-log.test.tsx мокает client, INV-F186-5 не проверяется"
- id: DATA-CURSOR-STABLE-KEY
  domain: data
  title: "Keyset-cursor не уникален (нет project_id в tie-break) → пропуск строк"
  detect: "go test -count=1 ./nexus/findings/ -run TestCursorPagination"
  severity: medium
  source: "F186 E8181: PK (project_id,finding_id), tie-break без project_id"
- id: DATA-HASMORE-OVERSCAN
  domain: data
  title: "has_more/next_cursor не подтверждены (overscan +1, trim) тестом"
  detect: "go test -count=1 ./nexus/findings/ -run TestCursorPagination"
  severity: medium
  source: "ADR-KIT-073; store.go:132-139"
- id: DATA-SCOPE-VALIDATION
  domain: data
  title: "?project= вне scope не отвергается; RLS-биндинг расходится с фильтром"
  detect: "go test -count=1 -v -tags integration ./nexus/findings/ -run TestQuery_RLSProjectIsolation"
  severity: high
  source: "F186 (обе ветки): multi-project token → тихие 0 строк"
- id: DATA-DESCRIPTION-DERIVATION
  domain: data
  title: "Деривация описания (reason→file:line→«—») не соответствует спеке"
  detect: "go test -count=1 ./nexus/findings/ -run TestDeriveDescription"
  severity: low
  source: "F186: store.go DeriveDescription"
