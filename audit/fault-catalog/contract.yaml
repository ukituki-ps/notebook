# Fault catalog — contract (wire/OpenAPI/RBAC-статусы)
- id: CONTRACT-WIRE-CASING
  domain: contract
  title: "Wire snake_case не смаплен в camelCase → undefined-поля в UI"
  detect: "cd nexus-ui && npx vitest run src/__tests__/contract-adapter.test.tsx"
  severity: high
  canary_ref: "audit/canaries/seeds/ui-wire-casing"
  source: "F186 E8181: client.ts:28-29 — колонки Баг/Дата/Проект undefined"
- id: CONTRACT-ERROR-ENVELOPE
  domain: contract
  title: "Error-envelope расходится с общим common.yaml#APIError"
  detect: "go test -count=1 ./nexus/findings/ -run TestErrorEnvelope"
  severity: medium
  canary_ref: "audit/canaries/seeds/contract-error-envelope"
  source: "F186: {error,message} вместо {status,error∈enum}"
- id: CONTRACT-STATUS-CODE
  domain: contract
  title: "Задокументированный HTTP-статус ≠ фактический (напр. 405 vs 403)"
  detect: "go test -count=1 ./nexus/findings/ -run TestFindings_MethodNotAllowed"
  severity: medium
  source: "F186 (обе ветки): docs 405, роутер 403"
- id: CONTRACT-NULL-OMITEMPTY
  domain: contract
  title: "null vs omitempty расходятся со спецификацией/OpenAPI"
  detect: "go test -count=1 ./nexus/findings/ -run TestFindings_List"
  severity: low
  source: "F186 E8181: project_name/execution_id/unit_id omitted vs nullable"
- id: CONTRACT-DATE-BOUNDARY
  domain: contract
  title: "since/until off-by-one (включение следующего дня / потеря выбранного)"
  detect: "go test -count=1 -tags integration ./nexus/findings/ -run TestQueryDateBoundaryInclusiveDB"
  severity: high
  canary_ref: "audit/canaries/seeds/ui-until-offbyone"
  source: "F186 E8473 (over-include +1 day) + E8181 (exclude selected day)"
