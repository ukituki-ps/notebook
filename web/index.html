<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notebook</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="app">
    <!-- /login -->
    <section class="screen" data-screen="login" hidden>
      <div class="card" data-testid="login-card">
        <h1>Вход</h1>
        <p class="error" data-testid="login-error" role="alert" aria-live="polite" hidden></p>
        <form data-testid="login-form" id="login-form" novalidate>
          <label for="login-username">Username</label>
          <input data-testid="login-username" id="login-username" name="username"
                 type="text" autocomplete="username" autocapitalize="none"
                 spellcheck="false" required>

          <label for="login-password">Password</label>
          <input data-testid="login-password" id="login-password" name="password"
                 type="password" autocomplete="current-password" required>

          <button data-testid="login-submit" id="login-submit" type="submit">Login</button>
        </form>
        <p class="alt">Нет аккаунта? <a data-testid="register-link" href="/register">Register</a></p>
      </div>
    </section>

    <!-- /register -->
    <section class="screen" data-screen="register" hidden>
      <div class="card" data-testid="register-card">
        <h1>Регистрация</h1>
        <p class="error" data-testid="register-error" role="alert" aria-live="polite" hidden></p>
        <form data-testid="register-form" id="register-form" novalidate>
          <label for="register-username">Username (3-32: a-z A-Z 0-9 _ -)</label>
          <input data-testid="register-username" id="register-username" name="username"
                 type="text" autocomplete="username" autocapitalize="none"
                 spellcheck="false" required>

          <label for="register-password">Password (&gt;= 8 символов)</label>
          <input data-testid="register-password" id="register-password" name="password"
                 type="password" autocomplete="new-password" required>

          <label for="register-confirm">Confirm password</label>
          <input data-testid="register-confirm" id="register-confirm" name="confirm"
                 type="password" autocomplete="new-password" required>

          <button data-testid="register-submit" id="register-submit" type="submit">Register</button>
        </form>
        <p class="alt">Уже есть аккаунт? <a data-testid="login-link" href="/login">Login</a></p>
      </div>
    </section>

    <!-- /notes -->
    <section class="screen" data-screen="notes" hidden>
      <div class="card notes">
        <header class="notes-header" data-testid="notes-header">
          <span class="brand">Notebook</span>
          <span class="user-name" data-testid="user-name"></span>
          <button class="logout" data-testid="logout" id="logout" type="button">Logout</button>
        </header>

        <p class="error" data-testid="notes-error" id="notes-error" role="alert" aria-live="polite" hidden></p>
        <button data-testid="notes-retry" id="notes-retry" type="button" hidden>Повторить</button>

        <form class="note-form" data-testid="note-form" id="note-form" novalidate>
          <label for="note-input">Текст заметки</label>
          <textarea data-testid="note-input" id="note-input" name="text" rows="3"
                    placeholder="Введите заметку..." required></textarea>
          <button data-testid="add-note" id="add-note" type="submit" disabled>Add</button>
        </form>

        <p class="muted" data-testid="notes-loading" id="notes-loading"
           role="status" aria-live="polite" hidden>Загрузка...</p>

        <div class="notes-search" role="search" aria-label="Поиск заметок">
          <label for="notes-search">Поиск заметок</label>
          <div class="notes-search-row">
            <input data-testid="notes-search" id="notes-search" name="search"
                   type="search" autocomplete="off" spellcheck="false"
                   placeholder="Поиск по тексту..." aria-controls="notes-list">
            <button data-testid="notes-search-clear" id="notes-search-clear"
                    class="notes-search-clear" type="button"
                    aria-label="Очистить поиск" hidden>Очистить</button>
          </div>
        </div>

        <div class="note-item" data-testid="notes-offline" id="notes-offline"
             role="status" hidden>
          <p class="note-text muted" id="notes-offline-text">Нет сети — показаны загруженные заметки.</p>
          <button data-testid="notes-offline-check" id="notes-offline-check"
                  type="button" aria-label="Проверить сеть">Проверить сеть</button>
        </div>

        <p class="muted" data-testid="notes-search-count" id="notes-search-count"
           aria-live="polite" hidden>Найдено 0</p>

        <p class="muted" data-testid="notes-empty" id="notes-empty" hidden>
          Пока нет заметок. Добавьте первую выше.
        </p>
        <p class="muted" data-testid="notes-search-empty" id="notes-search-empty"
           role="status" aria-live="polite" hidden>
          Ничего не найдено. Сократите запрос или очистите поиск.
        </p>
        <ul class="notes-list" data-testid="notes-list" id="notes-list" role="list"
            aria-busy="false" hidden></ul>
      </div>
    </section>
  </main>

  <!-- Single row template: app.js clones it per note (no phantom data). -->
  <template id="note-item-template">
    <li class="note-item" data-testid="note-item" role="listitem">
      <span class="note-text"></span>
      <button class="delete-note" data-testid="delete-note" type="button"
              aria-label="Удалить заметку">Удалить</button>
    </li>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
