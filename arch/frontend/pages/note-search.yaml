states:
  - id: idle
    detail: "Пустой запрос: форма, поиск, все загруженные заметки; clear/count скрыты."
  - id: results
    detail: "Непустой запрос с совпадениями: отфильтрованный список, clear и count."
  - id: no-results
    detail: "Непустой запрос, 0 совпадений при непустой коллекции: notes-search-empty."
  - id: empty
    detail: "GET 200 [] при пустом запросе: notes-empty, поиск disabled (нечего фильтровать)."
  - id: loading
    detail: "notes-loading, поиск и форма disabled, список aria-busy=true, count/list скрыты."
  - id: error
    detail: "notes-error + notes-retry, поиск и форма disabled."
  - id: offline
    detail: "offline-banner + «Проверить сеть», поиск/форма/delete disabled, загруженные заметки видны."
  - id: offline-zero
    detail: "Нет сети и загруженных заметок нет: offline-banner + базовая пустая подсказка, форма/поиск disabled."

selectors:
  - testid: notes-search
    purpose: "поле поиска (type=search, aria-controls=notes-list)"
