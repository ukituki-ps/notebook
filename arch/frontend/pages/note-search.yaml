    kind: list-item
    label: "Заметка: #<id> <text> (role=listitem)"
    registry_id: patterns/note-item
    selector: ".note-item"
    states: [default, pending]
  - id: n-delete
    kind: button
    label: "Delete (aria-label=«Удалить заметку #<id>»)"
    registry_id: null
    path6: true
