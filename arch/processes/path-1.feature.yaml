  phase: acceptance
  prompt_patch: 'RED-TEAM АУДИТ (adversarial, attack-log). Идёт на ДРУГОЙ модели, чем автор. МОДЕЛЬ-ПОЛИТИКА (ADR-KIT-090
    model-distinct, дешёвая кросс-пара — БЕЗ DeepSeek V4 Pro): если автор кода = `deepseek/deepseek-flash` (V4.1 Flash) →
    проверяющий = `llama-proxy/qwen3.8-fast`; если автор кода = `llama-proxy/qwen3.8-fast` → проверяющий = `deepseek/deepseek-flash`.
    В артефакте укажи `reviewer{model,provider}`, `author_model`, `author_provider` — гейт `gate-code-review` сверит кросс-пару
    по `tools/model-policy.json` и упадёт при одном провайдере/модели. Запускай reviewer только на localhost:8090 (llama-proxy)
    или provider deepseek; V4 Pro не использовать по умолчанию. Атакуй реализацию: реальные вызовы эндпоинтов/RLS/скоупов,
    канарейки (машинное доказательство), битые состояния, код-статусы. Артефакт doc/идеи/<F>/fault-verdicts.json + attack-log.  НЕЗАВИСИМОСТЬ
    (ADR-KIT-090, E9236): шаг исполняет РАЗОВЫЙ независимый агент-ревьюер (НЕ team-lead, НЕ автор). В артефакт пиши author_session_id
    (или session_id) и reviewer_session_id — они ДОЛЖНЫ различаться (gate-code-review fail-close при совпадении/отсутствии).
    Модель — по кросс-паре tools/model-policy.json. Самопроверка запрещена.'
