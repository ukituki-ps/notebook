  result_schema:
    type: object
    required:
    - context
    - specs
    - contract_diff
    - contract_parity
    properties:
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
      specs:
        type: array
        minItems: 1
        items:
          type: object
          required:
