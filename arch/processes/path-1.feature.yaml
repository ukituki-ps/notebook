          artifacts:
            type: array
            items:
              type: string
- id: s06d.canonize
  name: Канонизация понятий (architect; C-4)
  description: 'Одно понятие = одно определение (term/definition/storage/version). Публикует {context.canon} — путь к артефакту-канону для гейта поведения (C-5).

