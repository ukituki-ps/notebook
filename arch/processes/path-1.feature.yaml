- id: s15.brief_milestone
  name: Бриф вехи (planner subagent)
  description: 'Бриф вехи (planner subagent): результат — M{NN}/brief.md. Опирается на: saved-plan, specs. ОБЯЗАТЕЛЕН (ревизия 2.11.11): экономия на подготовке не оправдывает риск «сделали не то»; бриф вехи фиксирует границы вехи до кода.'
  phase: planning
