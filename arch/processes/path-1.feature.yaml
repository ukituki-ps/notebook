- id: after_s01_snapshot
  description: 'Готовый бриф + reality snapshot (C-1…C-5 исполняются): старт со s02, s06a–s06e НЕ в skip — сверка «код vs модель» до проектирования (s10.change_definition).'
  start_from: s02.architect_scope_analysis
  required_context:
  - feature_brief_path
  - work_branch
  skip_steps:
  - s01.product_discuss
  - s24a.branch_fresh
  - s45.push_primary
  - s46.post_deploy_verify
- id: after_s16
  description: 'Старт после s16.brief_tasks (F98): планирование не перезапускается; s17.coverage_audit проверяет брифы/спеки и открывает s20 fan-out. required_context — producer-данные (unit_briefs/task_briefs), отсутствие — отказ резолва ДО старта; обход через orc_set_context запрещён.'
  start_from: s17.coverage_audit
