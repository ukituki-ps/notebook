  - s06c.reconcile_verify
  - s06d.canonize
  - s06e.reproduce
  - s10.change_definition
  - s11.planner_high_level
  - s13.plan_save
  - s14.spec_generation
  - s15.brief_milestone
  - s16.brief_tasks
  - s24a.branch_fresh
  - s45.push_primary
  - s46.post_deploy_verify
- id: unit_batch
  description: 'Юнит-ветка: старт на fan-out контейнере s20.sde_execution (нужен context.unit_briefs)'
  start_from: s20.sde_execution
  skip_steps:
  - s01.product_discuss
  - s02.architect_scope_analysis
  - s03.proto_visualize
  - s04.graph_builder_design
  - s05.architect_validation
  - s06.feature_brief_final
  - s07.requirements_reconcile
  - s08.intent_brief_review
  - s06a.reality_snapshot
  - s06b.reconcile
  - s06c.reconcile_verify
  - s06d.canonize
  - s06e.reproduce
  - s10.change_definition
  - s11.planner_high_level
  - s13.plan_save
  - s14.spec_generation
  - s15.brief_milestone
  - s16.brief_tasks
  - s17.coverage_audit
  - s24a.branch_fresh
  - s45.push_primary
  - s46.post_deploy_verify
  required_context:
  - unit_briefs
  - work_branch
- id: branch_guard
  description: 'Opt-in guard свежести рабочей ветки (C-17): s24a.branch_fresh исполняется, default-точки его скипают'
  start_from: s01.product_discuss
  skip_steps:
  - s06a.reality_snapshot
  - s06b.reconcile
  - s06c.reconcile_verify
  - s06d.canonize
  - s06e.reproduce
  - s45.push_primary
  - s46.post_deploy_verify
  required_context:
  - work_branch
  - target_repo_head
- id: stand_contour
  description: 'Opt-in пост-merge контур стенда (C-18/C-19): push primary → CI+образ+golden path; активация проектом через orc_start(entry_point=stand_contour, context={...})'
  start_from: s45.push_primary
  required_context:
  - push_target
  - work_branch
  - target_repo_head
  - stand_url
  - golden_path_command
steps:
- id: s01.product_discuss
  name: Обсуждение идеи с product
  description: 'Обсуждение идеи с product: результат — черновик feature-brief.md. Опирается на: idea. ОБЯЗАТЕЛЬНО: сразу после создания каталога фичи задай в контекст исполнения feature_id=<F<NN>-<slug>> и feature_dir=doc/идеи/<F<NN>-<slug>> (orc_set_context) — иначе плейсхолдер {feature_id} в artifact-гейтах (s10/s13/s14) не отрендерится и приёмка упадёт «artifact not found» (инцидент E3061, s10).

    '
  phase: ideation
  stage: exploration
  agent: product
  track: docs
  mode: all
  skippable: true
  artifact: черновик feature-brief.md
  inputs:
  - idea
  outputs:
  - draft-feature-brief
  depends_on: []
  arch_reads:
  - type: search
    query: похожие реализованные фичи
- id: s02.architect_scope_analysis
  name: Scope Analysis (architect)
  phase: ideation
  stage: exploration
  agent: architect
  track: infra
  mode: all
  artifact: Scope Report
  inputs:
  - draft-feature-brief
  outputs:
  - scope-report
  depends_on:
  - s01.product_discuss
  description: 'Архитектор определяет затронутые домены, ограничения архитектуры, потенциальные конфликты и даёт рекомендации для дизайна.

    '
  arch_reads:
  - type: related
    target: домены из draft-feature-brief
  - type: gaps
    filter: open violations in affected domains
- id: s03.proto_visualize
  name: Визуализация UI (proto)
  description: 'Визуализация UI (proto): результат — ASCII-схема в feature-brief.md. Опирается на: draft-feature-brief, scope-report.

    '
  phase: ideation
  stage: design
  agent: proto
  track: B
  mode: subagent
  when:
    param: feature_profile
    in:
    - full
    - frontend
  artifact: ASCII-схема в feature-brief.md
  inputs:
  - draft-feature-brief
  - scope-report
  outputs:
  - visualized-brief
  depends_on:
  - s02.architect_scope_analysis
- id: s04.graph_builder_design
  name: UI-граф из дизайна (graph-builder from-design)
  description: 'UI-граф из дизайна (graph-builder from-design): результат — UI-GRAPH.yaml (planned-graph). Опирается на: visualized-brief, scope-report. Остаётся опциональным (дизайн-граф спекулятивен); обязательна только актуализация по коду — s21.'
  phase: ideation
  stage: design
  agent: graph-builder
  track: B
  mode: subagent
  when:
    param: feature_profile
    in:
    - full
    - frontend
  artifact: UI-GRAPH.yaml (planned-graph)
  inputs:
  - visualized-brief
  - scope-report
  outputs:
  - planned-ui-graph
  depends_on:
  - s03.proto_visualize
  arch_writes:
  - type: create_or_update
    target: arch/frontend/pages/*.yaml
    status: planned
- id: s05.architect_validation
  name: Валидация архитектора
  phase: ideation
  stage: validation
  agent: architect
  track: infra
  mode: all
  artifact: Expertise Report (валидация)
  inputs:
  - visualized-brief
  - planned-ui-graph
  - scope-report
  outputs:
  - expertise-report
  depends_on:
  - s04.graph_builder_design
  - s02.architect_scope_analysis
  description: 'Проверка соответствия дизайна архитектурным ограничениям. ОБЯЗАТЕЛЬНО публикуй open_decisions[] — развилки, где сырой запрос человека допускает ≥2 прочтения (напр. неоднозначная формулировка): архитектор формулирует варианты и рекомендацию, но НЕ решает двусмысленность молча — она уходит на s07.requirements_reconcile как вопрос человеку. Решения B* давай явно и трассируемо к пункту запроса (decision_ref), чтобы переинтерпретация не спряталась.

    '
- id: s06.feature_brief_final
  name: Финализация feature-brief.md
  description: 'Финализация feature-brief.md: результат — feature-brief.md (финал). Опирается на: expertise-report. Дополнительно сохраняет doc/идеи/<F>/invariants.json с теми же invariants[] (id/statement/test_ref/enforcement) — файл-артефакт machine-гейтов (test-ref-runnable, catalog-invariants, ui-audit). Если path1.ui.json.platform ∈ {web,mobile,both} — добавь в invariants.json core INV-UI-TRUTH, INV-UI-LABEL, INV-UI-A11Y-NAME, INV-UI-ORACLE (формат — doc/процесс/ui-invariants.md). Статусы ядра: INV-UI-TRUTH/LABEL/A11Y-NAME — active с исполнимым test_ref. INV-UI-ORACLE публикуй со status `proposed`: его enforcement — гейты s22a (gate-ui-audit-machine) и oracle-cited s22/s24, а ui-audit.json появляется только на s22a, поэтому active-инвариант с test_ref на s20a недопустим (gate-invariant-enforced). Общее правило: если оракул инварианта материализуется ПОЗЖЕ (стендовый E2E на s20c, ui-audit.json на s22a), публикуй его со status `proposed` до этого шага — иначе active-инвариант с test_ref на s20a недопустим (gate-invariant-enforced). Так же публикуй INV-UI-E2E-PREVIEW (его оракул — E2E на стенде со скриншотом, s20c).

    '
  phase: ideation
  stage: validation
  agent: product
  track: docs
  mode: all
  artifact: feature-brief.md (финал)
  inputs:
  - expertise-report
  outputs:
  - feature-brief
  depends_on:
  - s05.architect_validation
  result_schema:
    type: object
    required:
    - invariants
    - do
    - dont
    - out_of_scope
    - change_class
    properties:
      invariants:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - id
          - statement
          - enforcement
          properties:
            id:
              type: string
            statement:
              type: string
            rationale:
              type: string
            enforcement:
              type: string
            status:
              type: string
              enum:
              - proposed
              - active
              - deprecated
            test_ref:
              type: string
      do:
        type: array
        minItems: 1
        items:
          type: string
      dont:
        type: array
        minItems: 1
        items:
          type: string
      out_of_scope:
        type: array
        items:
          type: string
      change_class:
        type: string
        enum:
        - plain
        - security
        - invariant
        - arch
- id: s07.requirements_reconcile
  name: Сверка требований «просил человек ↔ делаем» (product)
  description: 'Обязательная сверка ДО планирования (закрывает дефект E2669: гейты проверяли согласованность с самими собой, а не с запросом человека). product читает НЕИЗМЕНЯЕМЫЙ сырой запрос человека (context.feature_request_path или doc/идеи/<F>/feature-request.md) и артефакты проектирования (feature-brief, scope-report, expertise-report, visualized-brief, planned-ui-graph) и публикует два артефакта: (1) doc/идеи/<F>/intent-trace.json — машинный манифест items[{item_id, raw_quote, our_interpretation, verdict∈{match,reinterpreted,missing,dropped}, decision_ref, scenario_ref, added, confirmed_by_human}] + open_questions[]; (2) doc/идеи/<F>/intent-brief.md — КОРОТКИЙ (1–2 экрана, НЕ спека и не план) человекочитаемый документ: цель, таблица «просил→делаем», отдельный раздел «где домыслили / что добавили от себя», ссылки на прототипы (s03/s04). Правила: каждый пункт сырого запроса обязан иметь запись (silent drop запрещён); verdict=reinterpreted или added требует явного подтверждения человеком (s08); двусмысленности из s05.open_decisions[] выносятся вопросами к человеку, а не решаются молча. Источник сверки — СЫРОЙ запрос, не бриф (иначе самопроверка тавтологична).

    '
  phase: ideation
  stage: validation
  agent: product
  track: docs
  mode: all
  artifact: intent-trace.json + intent-brief.md
  inputs:
  - feature-request
  - feature-brief
  - scope-report
  - expertise-report
  - visualized-brief
  - planned-ui-graph
  outputs:
  - intent-trace
  - intent-brief
  depends_on:
  - s06.feature_brief_final
  result_schema:
    type: object
    required:
    - artifact_path
    - items
    - open_questions
    - context
    properties:
      artifact_path:
        type: string
      intent_brief_path:
        type: string
      items:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - item_id
          - raw_quote
          - our_interpretation
          - verdict
          properties:
            item_id:
              type: string
            raw_quote:
              type: string
            our_interpretation:
              type: string
            verdict:
              type: string
              enum:
              - match
              - reinterpreted
              - missing
              - dropped
            decision_ref:
              type: string
            scenario_ref:
              type: string
            added:
              type: boolean
            confirmed_by_human:
              type: string
              enum:
              - true
              - false
              - edited
      open_questions:
        type: array
        items:
          type: string
      summary:
        type: object
      context:
        type: object
- id: s08.intent_brief_review
  name: Человек утверждает «что делаем» (intent-brief)
  description: 'Обязательный человеческий чекпойнт перед планированием (возврат human-in-the-loop, снятого в 2.3.0). Человек получает КОРОТКИЙ intent-brief.md, а не 1000 страниц брифа/плана: цель, таблица «просил→делаем», список домыслов/добавлений, прототипы. Решение: approved=true + signature (policy(<process>@<version> <YYYY-MM-DD>) или свободная) и/или edits[] + disposition. Правки человека обязаны быть внесены в intent-trace.json (confirmed_by_human=edited) и при необходимости в feature-brief.md ДО перехода к s10. Без человеческого решения подтверждение не фиксируется (событие l5_unsigned) — планирование стартовать не должно.'
  phase: ideation
  stage: validation
  agent: human
  track: docs
  mode: all
  artifact: утверждение intent-brief
  inputs:
  - intent-brief
  - intent-trace
  outputs:
  - approved-intent
  depends_on:
  - s07.requirements_reconcile
  max_retries: 5
- id: s06a.reality_snapshot
  name: Reality-snapshot (auditor; C-1)
  description: 'Снимок реального состояния кода: scope, узлы nodes[].{id,kind,ref[,run_result]}, commit, actual_behavior. Заземляет планирование фактом, а не текстом брифа.

    '
  phase: planning
  agent: auditor
  track: infra
  mode: subagent
  artifact: reality-snapshot
  inputs:
  - feature-brief
  outputs:
  - reality-snapshot
  depends_on:
  - s08.intent_brief_review
  result_schema:
    type: object
    required:
    - scope
    - nodes
    - commit
    - context
    properties:
      scope:
        type: string
      commit:
        type: string
      actual_behavior:
        type: string
      nodes:
        type: array
        items:
          type: object
          required:
          - id
          - kind
          - ref
          properties:
            id:
              type: string
            kind:
              type: string
            ref:
              type: string
            run_result: {}
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
- id: s06b.reconcile
  name: Reconcile-вердикт с классификацией дрейфа (architect; C-2)
  description: 'Сверка снимка с брифом/спеками: coverage{total,resolved} и divergences[] с classification ∈ doc_stale|code_bug|expectation_wrong|no_drift.

    '
  phase: planning
  agent: architect
  track: infra
  mode: all
  artifact: reconcile-verdict
  inputs:
  - reality-snapshot
  - feature-brief
  outputs:
  - reconcile-verdict
  depends_on:
  - s06a.reality_snapshot
  result_schema:
    type: object
    required:
    - coverage
    - divergences
    - context
    properties:
      coverage:
        type: object
        required:
        - total
        - resolved
        properties:
          total:
            type: integer
          resolved:
            type: integer
      divergences:
        type: array
        items:
          type: object
          required:
          - id
          - classification
          properties:
            id:
              type: string
            classification:
              type: string
              enum:
              - doc_stale
              - code_bug
              - expectation_wrong
              - no_drift
            outcome:
              type: string
            severity:
              type: string
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
- id: s06c.reconcile_verify
  name: Независимая верификация reconcile (architect ≠ auditor; C-3)
  description: 'Правило 4: кто снимал реальность (auditor), не проверяет сам себя; верификацию ведёт architect. Машинной проверки «разные личности» в движке нет (2.0.0) — здесь независимость обеспечивается разными агентами.

    '
  phase: planning
  agent: architect
  track: infra
  mode: all
  artifact: reconcile-verify
  inputs:
  - reconcile-verdict
  outputs:
  - reconcile-verified
  depends_on:
  - s06b.reconcile
  result_schema:
    type: object
    required:
    - verdict
    - verified_by
    - context
    properties:
      verdict:
        type: string
        enum:
        - pass
