    auth-слоя); envelope во ВСЕХ слоях = common.yaml#APIError; тест на каждый негатив; без мёртвых веток/двойных источников.'
  prompt_patch_append: 'DS-КОНТРАКТ: feature-unit''ы используют компоненты только из

