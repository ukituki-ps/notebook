    target: task artifacts с деталями
- id: s17.coverage_audit
  name: Аудит покрытия (architect)
  phase: planning
  agent: architect
  track: infra
  mode: all
  artifact: отчёт об аудите покрытия
  inputs:
  - task-briefs
  - specs
  - saved-plan
  outputs:
  - coverage-audit
  depends_on:
  - s16.brief_tasks
  max_retries: 2
  result_schema:
    type: object
    required:
    - context
    - verdict
    - gaps
    properties:
      verdict:
        type: string
        enum:
        - pass
        - pass_with_gaps
        - fail
      gaps_has_blocking:
        type: boolean
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
      gaps:
        type: array
        items:
          type: object
          required:
          - id
          - severity
          - owner
          properties:
            id:
              type: string
            severity:
              type: string
              enum:
              - info
              - minor
              - major
              - critical
            owner:
              type: string
            description:
              type: string
            check:
              type: string
      coverage:
        type: object
  description: 'КРИТИЧЕСКИЙ ГЕЙТ перед переходом к исполнению. Проверяет что spec полностью готова ко всем аспектам. Плюс вердикты по КАТАЛОГУ ОТКАЗОВ: сохрани doc/идеи/<F>/fault-verdicts.json — {"<catalog_id>": {"verdict":"covered|gap|na", "check":"…", "proof_run_id|detector_exit|evidence":"…"(covered), "justification":"…"(na/gap)}} по каждому id из audit/fault-catalog/*. covered без proof недопустим (вердикт на суждении); na — только с обоснованием (наследование базового инварианта и т.п.). Если proof унаследован из другого прогона/фичи (proof_run_id чужого прогона) — добавь inherited_from: "<feature>/<run>" (иначе вердикт считается недоказанным). Гейт gate-catalog-invariants (s20a) принимает na+justification вместо активного инварианта. ВЕРДИКТ (3.1.1): публикуй verdict ∈ {pass,pass_with_gaps,fail} и gaps[].{severity ∈ info|minor|major|critical, owner}; ОБЯЗАТЕЛЬНО сохрани машинное зеркало doc/идеи/<F>/coverage-audit.json {verdict, coverage{total,resolved}, gaps[{id,severity,owner,description,check}]} — его читает gate-coverage-verdict. Правило: verdict=fail или любой gap major/critical → гейт FAIL (в т.ч. pass_with_gaps); pass_with_gaps только с info/minor проходит и открывает s20; при FAIL работает ветка s17→s16 (max_cycles 2 → quarantine). Флаг gaps_has_blocking = true при любом gap severity major|critical — на него опирается условие ветки (правила условий не ищут по массиву gaps).

    '
- agent: team-lead
  context_updates:
    stand_dsn_ref: '{result.dsn_ref}'
    stand_url: '{result.stand_url}'
  depends_on:
  - s17.coverage_audit
  id: s19.stand_lease
  inputs:
  - coverage-audit
  name: STAND LEASE — арендовать тестовый стенд (эксклюзивно) под исполнение
  optional: false
  outputs:
  - stand-lease
  phase: execution
  track: B
- id: s20.sde_execution
  name: BATCH — юнит-модель feature-unit (C-10/C-14)
  phase: execution
  agent: orc
  track: infra
  mode: all
  invoke:
    sub_process: feature-unit
    for_each: context.unit_briefs
    max_parallel: 3
    unit_key: unit_id
    block_on_quarantine: true
  inputs:
  - task-briefs
  - specs
  outputs:
  - implementation
  depends_on:
  - s17.coverage_audit
  - s19.stand_lease
  prompt_patch: 'DoD КАЖДОГО юнита: валидация всех входов (400); статус-коды по spec/contract-matrix.md (вкл. 405/403/envelope auth-слоя); envelope во ВСЕХ слоях = common.yaml#APIError; тест на каждый негатив; без мёртвых веток/двойных источников.'
- id: s20a.unit_integrate
  name: Интеграция юнитов + сводный отчёт (C-10)
  phase: execution
  agent: architect
  track: infra
  mode: all
  artifact: сводный report.md
  inputs:
