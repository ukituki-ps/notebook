- id: s22a.ui_audit
  name: UI/UX-аудит (designer; чек-лист A–L / M)
  description: 'Независимый аудит интерфейса: состояния/честность, информативность, человеческий слой, визуальная система, композиция, взаимодействие, a11y, адаптив/устройства, данные/контракты, перф, завершённость, доказательства; для mobile — блок M (safe-area, тач-цели, нативные паттерны, dynamic type, permissions, offline, VoiceOver/TalkBack, golden path). Каждый пункт — criterion + oracle. Публикует ui-audit.{md,json}, привязанный к SHA стенда. ВАЖНО: stand.sha ОБЯЗАН равняться выкаченному ref из preview-deploy.json (корень репо; gate-ui-audit сверяет и падает «аудит не на том билде»). Не записывай sha локального HEAD. Файлы (ровно один doc/идеи/<F>/ui-audit.json): platform; stand{url,sha=билд стенда}; summary{open_critical_high:0,blockers:0}; items[{id,block,verdict(ok|violation|na),severity,criterion,oracle(исполнимый cmd:/sh:/<file>::<Test>/url/dom),evidence{kind,ref}}]. Обязательные блоки: web A–L, mobile A,C,D,F,G,I,K,L,M, both A–M. Также требуется doc/идеи/<F>/invariants.json с core INV-UI-*. Точный контракт — doc/процесс/ui-invariants.md §Форматы; проверяет bash tools/path1-gate.sh ui-audit {execution_id}. Зависит от s20a.unit_integrate и s20c.preview_verify (base 3.1.9): порядок «аудит после превью» гарантирован базовым DAG (gate-preview-before-ui).'
  phase: acceptance
  agent: designer
  track: B
  mode: subagent
  when:
    param: feature_profile
    in:
    - full
    - frontend
  artifact: ui-audit.md + ui-audit.json
  inputs:
  - implementation
  - actualized-ui-graph
  - specs
  - preview-verdict
  outputs:
  - ui-audit
  depends_on:
  - s20a.unit_integrate
  - s20c.preview_verify
  max_retries: 2
  result_schema:
    type: object
    required:
    - artifact_path
    - platform
    - stand
    - summary
    - items
    - context
    properties:
      artifact_path:
        type: string
      platform:
        type: string
        enum:
        - web
        - mobile
        - both
        - none
      stand:
        type: object
        required:
        - sha
        - url
        properties:
          sha:
            type: string
          url:
            type: string
      summary:
        type: object
        required:
        - blockers
        - majors
        - open_critical_high
        properties:
          blockers:
            type: integer
          majors:
            type: integer
          minors:
            type: integer
          cosmetics:
            type: integer
          open_critical_high:
            type: integer
          ui_absent_reason:
            type: string
      items:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - id
          - block
          - criterion
          - verdict
          - evidence
          properties:
            id:
              type: string
            block:
              type: string
            criterion:
              type: string
            verdict:
              type: string
              enum:
              - ok
              - violation
              - na
            severity:
              type: string
              enum:
              - blocker
              - major
              - minor
              - cosmetic
            oracle:
              type: string
            reason:
              type: string
            evidence:
              type: object
              required:
              - kind
              - ref
              properties:
                kind:
                  type: string
                  enum:
                  - command
                  - screenshot
                  - url
                  - dom
                ref:
                  type: string
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
- id: s22d.mobile_probe
  name: Mobile-проба (tester-run-mobile; устройства + golden path)
  description: 'Снимает доказательства для блока M на устройствах/эмуляторах: матрица (iPhone + Android), safe-area, тач-цели, dynamic type, тёмная тема, permissions, offline/плохая сеть, VoiceOver/TalkBack, golden path как Maestro-флоу. Публикует mobile-evidence.json (stand.sha, devices[], flows[], screenshots[]). Опционально; активируется для platform mobile/both. Base 3.1.9 зависит от s20a.unit_integrate и s20c.preview_verify; превью-гейт gate-preview-before-mobile — в базе.

    '
  phase: acceptance
  agent: tester-run-mobile
  track: B
  mode: subagent
  when:
    param: platform
    in:
    - mobile
    - both
  artifact: mobile-evidence.json + screenshots
  inputs:
  - implementation
  - preview-verdict
  outputs:
  - mobile-evidence
  depends_on:
  - s20a.unit_integrate
  - s20c.preview_verify
  max_retries: 2
- id: s22.result_audit
  name: Аудит результата (architect)
  description: 'Аудит результата (architect): результат — результат аудита. Опирается на: implementation, actualized-ui-graph, change-definitions.

    '
  phase: acceptance
  agent: architect
  track: infra
  mode: all
  artifact: результат аудита
  inputs:
  - implementation
  - actualized-ui-graph
  - change-definitions
  outputs:
  - result-audit
  depends_on:
  - s22a.ui_audit
  - s22d.mobile_probe
  - s20c.preview_verify
  max_retries: 2
  result_schema:
    type: object
    required:
    - verdict
    - new_findings
    - context
    - evidence
    - acceptance_criteria
    - oracles
    properties:
      verdict:
        type: string
        enum:
        - pass
        - fail
      new_findings:
        type: array
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - id
          properties:
            id:
              type: string
            statement:
              type: string
      oracles:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - criterion_id
          - oracle
          - proof
          properties:
            criterion_id:
              type: string
            oracle:
              type: string
            proof:
              type: string
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
      evidence:
        type: array
        items:
          type: object
          required:
          - id
          - command
          properties:
            id:
              type: string
            command:
              type: string
            evidence_id:
              type: string
            file:
              type: string
            line:
              type: integer
            before:
              type: string
            after:
              type: string
- agent: reviewer
  depends_on:
  - s22.result_audit
  id: s22b.red_team_audit
  inputs:
  - result-audit
  name: RED-TEAM AUDIT — adversarial на стенде (attack-log)
  outputs:
  - red-team-verdict
  phase: acceptance
  prompt_patch: 'RED-TEAM АУДИТ (adversarial, attack-log). Идёт на ДРУГОЙ модели, чем автор. МОДЕЛЬ-ПОЛИТИКА (ADR-KIT-090 model-distinct, дешёвая кросс-пара — БЕЗ DeepSeek V4 Pro): если автор кода = `deepseek/deepseek-flash` (V4.1 Flash) → проверяющий = `llama-proxy/qwen3.8-fast`; если автор кода = `llama-proxy/qwen3.8-fast` → проверяющий = `deepseek/deepseek-flash`. В артефакте укажи `reviewer{model,provider}`, `author_model`, `author_provider` — гейт `gate-code-review` сверит кросс-пару по `tools/model-policy.json` и упадёт при одном провайдере/модели. Запускай reviewer только на localhost:8090 (llama-proxy) или provider deepseek; V4 Pro не использовать по умолчанию. Атакуй реализацию: реальные вызовы эндпоинтов/RLS/скоупов, канарейки (машинное доказательство), битые состояния, код-статусы. Артефакт doc/идеи/<F>/fault-verdicts.json + attack-log.  НЕЗАВИСИМОСТЬ (ADR-KIT-090, E9236): шаг исполняет РАЗОВЫЙ независимый агент-ревьюер (НЕ team-lead, НЕ автор). В артефакт пиши author_session_id (или session_id) и reviewer_session_id — они ДОЛЖНЫ различаться (gate-code-review fail-close при совпадении/отсутствии). Модель — по кросс-паре tools/model-policy.json. Самопроверка запрещена.'
  track: B
- agent: reviewer
  depends_on:
  - s22b.red_team_audit
  - s20c.preview_verify
  id: s22c.adversarial_code_review
  inputs:
  - result-audit
  - preview-verdict
  name: CODE REVIEW — адверсариальный разбор кода независимой моделью
  outputs:
  - code-review
  phase: acceptance
  prompt_patch: 'АДВЕРСАРИАЛЬНОЕ КОД-РЕВЬЮ (не отчётов). Обязан идти на ДРУГОЙ модели, чем автор. МОДЕЛЬ-ПОЛИТИКА (ADR-KIT-090 model-distinct, дешёвая кросс-пара — БЕЗ DeepSeek V4 Pro): если автор кода = `deepseek/deepseek-flash` (V4.1 Flash) → проверяющий = `llama-proxy/qwen3.8-fast`; если автор кода = `llama-proxy/qwen3.8-fast` → проверяющий = `deepseek/deepseek-flash`. В артефакте укажи `reviewer{model,provider}`, `author_model`, `author_provider` — гейт `gate-code-review` сверит кросс-пару по `tools/model-policy.json` и упадёт при одном провайдере/модели. Запускай reviewer только на localhost:8090 (llama-proxy) или provider deepseek; V4 Pro не использовать по умолчанию. Читай `git diff <base>...HEAD` и САМ КОД; локально запускай go build/vet/test, tsc/vitest; сверяй spec/openapi/common.yaml с фактическим поведением; форензика evidence. Ищи реальные дефекты: off-by-one, dead-end состояния, scope/RLS mismatch, дрейф контракта, утечки, мёртвый код. Read-only. Артефакт doc/идеи/<F>/code-review.json.  НЕЗАВИСИМОСТЬ (ADR-KIT-090, E9236): шаг исполняет РАЗОВЫЙ независимый агент-ревьюер (НЕ team-lead, НЕ автор). В артефакт пиши author_session_id (или session_id) и reviewer_session_id — они ДОЛЖНЫ различаться (gate-code-review fail-close при совпадении/отсутствии). Модель — по кросс-паре tools/model-policy.json. Самопроверка запрещена.'
  track: B
- id: s23.refinement
  name: Доработка по замечаниям (sde-backend/sde-frontend)
  description: 'Доработка по замечаниям (sde-backend/sde-frontend): результат — исправленный код. Опирается на: result-audit.

    '
  phase: acceptance
  agent: sde-backend
  track: A
  mode: subagent
  artifact: исправленный код
  inputs:
  - result-audit
  outputs:
  - refined-implementation
  depends_on:
  - s22.result_audit
  - s22b.red_team_audit
  - s22c.adversarial_code_review
  optional: true
  max_retries: 2
  invalidates:
  - s20a.unit_integrate
  skip_satisfied_deps: true
- id: s24a.branch_fresh
  name: BRANCH-FRESH — head рабочей ветки = target_repo_head (C-17; opt-in)
  description: 'Machine-guard свежести рабочей ветки до финальной приёмки: head(work_branch) обязан совпасть с доставляемым target_repo_head. Активация — entry point branch_guard + required_context [work_branch, target_repo_head].

    '
  phase: acceptance
  agent: orc
  track: infra
  mode: all
  inputs: []
  outputs: []
  depends_on:
  - s23.refinement
  - s22b.red_team_audit
  - s22c.adversarial_code_review
- id: s24.team_lead_accept
  name: Приёмка и коммит (team-lead)
  description: 'Приёмка и коммит (team-lead): результат — коммит + отчёт. Опирается на: refined-implementation, result-audit.

    '
  phase: done
  agent: team-lead
  track: infra
  mode: all
  artifact: коммит + отчёт
  inputs:
  - refined-implementation
  - result-audit
  outputs:
  - committed
  depends_on:
  - s23.refinement
  - s24a.branch_fresh
  - s22c.adversarial_code_review
  result_schema:
    type: object
    required:
    - artifact_path
    - context
    properties:
      artifact_path:
        type: string
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
  arch_writes:
  - type: commit_log
    target: execution log в git
- id: s45.push_primary
  name: PUSH-PRIMARY — push уже влитой ветки в primary для старта CI (C-19; opt-in)
  skippable: true
  description: 'Явный push ДО post-deploy verify: терминальная финализация срабатывает только на завершении прогона (после s46), поэтому без явного push CI/деплой не стартуют. Пушит в {context.push_target} (свойство проекта).

    '
  phase: acceptance
  agent: orc
  track: infra
  mode: all
  inputs: []
  outputs: []
  depends_on:
  - s24.team_lead_accept
- id: s46.post_deploy_verify
  name: POST-DEPLOY VERIFY — CI+образ+golden path по стенду (C-18; opt-in)
  skippable: true
  phase: acceptance
  agent: tester-run
  track: B
  mode: subagent
  inputs: []
  outputs:
  - post-deploy-verdict
  depends_on:
  - s45.push_primary
  result_schema:
    type: object
    required:
    - context
    - evidence
    - ci_run
    - stand_image
    - golden_path
    - outcome
    properties:
      context:
        type: object
      evidence:
        type: array
      ci_run:
        type: object
      stand_image:
        type: string
      golden_path:
        type: string
      outcome:
        type: string
        enum:
        - deploy_verified
        - deploy_failed
        - blocked_no_credentials
sub_processes:
  feature-unit:
    id: feature-unit
    params:
    - unit_id
    - sde
    - change_class
    - scope
    - files
    steps:
    - id: s10.unit_plan
      name: PLAN юнита (C-10)
      agent: planner
      track: docs
      mode: subagent
      result_schema:
        type: object
        required:
        - unit_plan
        - context
        properties:
          unit_plan:
            type: array
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on: []
    - id: s11.unit_execution
      name: DO юнита (C-10)
      agent: sde-backend
      agent_param: sde
      track: A
      mode: subagent
      result_schema:
        type: object
        required:
        - artifact_path
        - fixed_confirmed
        - context
        - evidence
        properties:
          artifact_path:
            type: string
          fixed_confirmed:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
          evidence:
            type: array
            items:
              type: object
              required:
              - id
              - command
              properties:
                id:
                  type: string
                command:
                  type: string
                evidence_id:
                  type: string
                file:
                  type: string
                line:
                  type: integer
                before:
                  type: string
                after:
                  type: string
      context_updates:
        report_path: '{result.artifact_path}'
      depends_on:
      - s10.unit_plan
    - id: s11a.arch_approve
      name: ARCH-APPROVE плана (when change_class ∈ security|invariant|arch; C-13)
      agent: architect
      track: infra
      mode: all
      when:
        param: change_class
        in:
        - security
        - invariant
        - arch
      result_schema:
        type: object
        required:
        - approved
        - context
        properties:
          approved:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s10.unit_plan
    - id: s12.unit_check
      name: CHECK юнита (C-10)
      agent: sde-backend
      agent_param: sde
      track: A
      mode: subagent
      result_schema:
        type: object
        required:
        - fixed_confirmed
        - context
        - evidence
        properties:
          fixed_confirmed:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
          evidence:
            type: array
            items:
              type: object
              required:
              - id
              - command
              properties:
                id:
                  type: string
                command:
                  type: string
                evidence_id:
                  type: string
                file:
                  type: string
                line:
                  type: integer
                before:
                  type: string
                after:
                  type: string
      depends_on:
      - s11.unit_execution
      - s11a.arch_approve
    - id: s13.unit_verify
      name: VERIFY юнита (architect ≠ executor; C-14/Правило 4)
      agent: architect
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - verdict
        - verified_by
        - context
        properties:
          verdict:
            type: string
            enum:
            - pass
            - fail
          verified_by:
            type: string
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s12.unit_check
    - id: s14.unit_quality
      name: QUALITY юнита (crutch density)
      agent: architect
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - crutch_density_grew
        - context
        properties:
          crutch_density_grew:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s13.unit_verify
    - id: s15.unit_regression
      name: REGRESSION юнита
      agent: auditor
      track: infra
      mode: subagent
      result_schema:
        type: object
        required:
        - new_findings
        - context
        properties:
          new_findings:
            type: array
            items:
              type: object
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s13.unit_verify
    - id: s16.unit_spec_sync
      name: SPEC-SYNC юнита
      agent: architect
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - synced
        - context
        properties:
          synced:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s13.unit_verify
    - id: s17.unit_verdict
      name: VERDICT юнита (machine outcome; C-14)
      agent: orc
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - outcome
        - context
        properties:
          outcome:
            type: string
            enum:
            - clean
            - not_clean
            - new_findings
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s14.unit_quality
      - s15.unit_regression
      - s16.unit_spec_sync
    - id: s18.unit_merge_unit
      name: MERGE_UNIT (machine merge в feature-ветку; C-14)
      agent: orc
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - merged
        properties:
          merged:
            type: boolean
      depends_on:
      - s17.unit_verdict
    gates:
      s13.unit_verify:
      - id: gate-unit-executor-distinct
        kind: executor-distinct
        layer: 1
        criteria:
        - 'baseline_step: s12.unit_check'
        on_fail:
          action: retry
          max_attempts: 2
          reason: verify-executor не отличается от executor (Правило 4)
          disposition: quarantine
      s17.unit_verdict:
      - id: gate-unit-verdict
        kind: unit-verdict
        layer: 1
        criteria:
        - 'fix_step: s12.unit_check'
        - 'fix_field: fixed_confirmed'
        - 'quality_step: s14.unit_quality'
        - 'quality_field: crutch_density_grew'
        - 'regression_step: s15.unit_regression'
        - 'regression_field: new_findings'
        - 'spec_sync_step: s16.unit_spec_sync'
        - 'spec_sync_field: synced'
        on_fail:
          action: retry
          max_attempts: 2
          reason: unit outcome не подтверждён машиной (не-clean)
          disposition: quarantine
      s18.unit_merge_unit:
      - id: gate-unit-merge
        kind: merge-unit
        layer: 1
        criteria:
        - 'branch: {context.parent_work_branch}'
        on_fail:
          action: retry
          max_attempts: 2
          reason: machine merge юнита в feature-ветку не выполнен
          disposition: quarantine
    branches:
    - from: s13.unit_verify
      condition: s13.unit_verify.verdict == 'fail'
      target_step: s11.unit_execution
      max_cycles: 2
      on_exhausted: quarantine
    - from: s17.unit_verdict
      condition: s17.unit_verdict.outcome == 'not_clean'
      target_step: s10.unit_plan
      max_cycles: 2
      on_exhausted: quarantine
    - from: s11a.arch_approve
      when:
        param: change_class
        in:
        - security
        - invariant
        - arch
      condition: s11a.arch_approve.approved != 'true'
      target_step: s10.unit_plan
      max_cycles: 2
      on_exhausted: quarantine
    - from: s12.unit_check
      when:
        param: change_class
        in:
        - security
        - invariant
        - arch
      condition: s11a.arch_approve.approved != 'true'
      target_step: s10.unit_plan
      max_cycles: 2
      on_exhausted: quarantine
gates:
  s06a.reality_snapshot:
  - id: gate-snapshot-freshness
    kind: freshness
    layer: 1
    criteria:
    - 'commit_key: commit'
    - 'head_ref: HEAD'
    on_fail:
      action: retry
      max_attempts: 2
      reason: снимок не пиннится к коммиту (freshness)
      disposition: quarantine
  - id: gate-snapshot-no-drift-proof
    kind: no-drift-proof
    layer: 1
    criteria:
    - 'scope_key: scope'
    - 'nodes_key: nodes'
    - 'node_kinds: all'
    on_fail:
      action: retry
      max_attempts: 2
      reason: не доказана полнота снимка (scope/nodes/ref/run_result)
      disposition: quarantine
  s06b.reconcile:
  - id: gate-reconcile-coverage
    kind: coverage
    layer: 1
    criteria:
    - 'total_key: coverage.total'
    - 'resolved_key: coverage.resolved'
    - 'divergences_key: divergences'
    on_fail:
      action: retry
      max_attempts: 2
      reason: не каждая дивергенция покрыта вердиктом (coverage)
      disposition: quarantine
  - id: gate-reconcile-finding-block
    kind: finding-block
    layer: 1
    criteria:
    - 'divergences_key: divergences'
    - 'scope: process'
    - 'max_open_critical_high: 0'
    on_fail: escalate
  s06c.reconcile_verify:
  - id: gate-reconcile-verify
    kind: agent
    layer: 4
    criteria:
    - verifier (architect) ≠ snapshot author (auditor)
    - независимая перепроверка классификации дрейфа
  - id: gate-rule4-executor-distinct
    kind: executor-distinct
    layer: 1
    criteria:
    - 'baseline_step: s06a.reality_snapshot'
    - 'snapshot_actor_key: author'
    - 'verify_actor_key: verified_by'
    on_fail:
      action: retry
      max_attempts: 2
      reason: verify-executor не отличается от snapshot-executor (Правило 4)
      disposition: quarantine
  s06e.reproduce:
  - id: gate-drift-expected-actual
    kind: command
    layer: 1
    command: '{context.drift_gate} verify --expected {context.canon} --actual {context.run_result}'
    require_exit_zero: true
    on_fail:
      action: retry
      max_attempts: 2
      reason: 'expected != actual: сделали не то, что описали (C-5)'
      disposition: quarantine
  - id: gate-repro-first
    kind: repro-first
    layer: 1
    criteria:
    - 'repro_key: repro'
    - 'pre_key: pre_exit_code'
    - 'post_key: post_exit_code'
