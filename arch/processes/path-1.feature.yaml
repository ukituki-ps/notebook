steps:
- id: s01.product_discuss
  name: Обсуждение идеи с product
  description: 'Обсуждение идеи с product: результат — черновик feature-brief.md. Опирается на: idea. ОБЯЗАТЕЛЬНО: сразу после
    создания каталога фичи задай в контекст исполнения feature_id=<F<NN>-<slug>> и feature_dir=doc/идеи/<F<NN>-<slug>> (orc_set_context)
    — иначе плейсхолдер {feature_id} в artifact-гейтах (s10/s13/s14) не отрендерится и приёмка упадёт «artifact not found»
    (инцидент E3061, s10).

    '
  phase: ideation
  stage: exploration
  agent: product
  track: docs
  mode: all
  skippable: true
  artifact: черновик feature-brief.md
  inputs:
  - idea
  outputs:
  - draft-feature-brief
  depends_on: []
  arch_reads:
  - type: search
    query: похожие реализованные фичи
- id: s02.architect_scope_analysis
  name: Scope Analysis (architect)
  phase: ideation
  stage: exploration
  agent: architect
  track: infra
  mode: all
  artifact: Scope Report
  inputs:
  - draft-feature-brief
  outputs:
  - scope-report
  depends_on:
  - s01.product_discuss
  description: 'Архитектор определяет затронутые домены, ограничения архитектуры, потенциальные конфликты и даёт рекомендации
    для дизайна.

    '
  arch_reads:
  - type: related
    target: домены из draft-feature-brief
  - type: gaps
    filter: open violations in affected domains
- id: s02a.ds_pin
  name: 'DS pin: версия, digest и нормализованные screens'
  description: 'Pre-fan-out pin для UI-профиля: выбирает approved DS-релиз, фиксирует

    design_system_version/ds_digest и нормализует context.screens[] в форму,

    которую ожидает fan-out design-unit. Каждый item содержит ровно

    screen_id, screen_brief, platform, feature_profile,

    design_system_version, ds_digest. Если screens отсутствует/пуст, создаётся

    один item screen_id=feature, screen_brief=<feature brief>. Без approved

    версии/digest шаг fail-close: latest/main/dev не допускаются.

    Для backend-only шаг не активируется.

    '
  phase: ideation
  agent: architect
  track: infra
  mode: all
  when:
    param: feature_profile
    in:
    - full
    - frontend
  artifact: ds-pin.json
  inputs:
  - scope-report
  - draft-feature-brief
  - approved-ds-release
  outputs:
  - ds-pin
  - screens
  context_updates:
    design_system_version: '{result.design_system_version}'
    ds_digest: '{result.ds_digest}'
    screens: '{result.screens}'
  depends_on:
  - s02.architect_scope_analysis
  result_schema:
    type: object
    required:
    - artifact_path
    - design_system_version
    - ds_digest
    - screens
    properties:
      artifact_path:
        type: string
      design_system_version:
        type: string
      ds_digest:
        type: string
      screens:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - screen_id
          - screen_brief
          - platform
          - feature_profile
          - design_system_version
          - ds_digest
          properties:
            screen_id:
              type: string
            screen_brief:
              type: string
            platform:
              type: string
              enum:
              - web
              - mobile
              - both
            feature_profile:
              type: string
              enum:
              - full
              - frontend
            design_system_version:
              type: string
            ds_digest:
              type: string
- id: s03.proto_visualize
  name: Визуализация UI по экранам (proto, fan-out)
  description: 'Fan-out-контейнер дизайна: по каждому экрану из context.screens запускает

    sub-process design-unit. Внутри unit: proto, резолв точной версии DS,

    UI-ревью и UX-ревью. Выход s03 — visualized-brief-units; фичевый

    visualized-brief собирает s03a.design_integrate. Для backend-only шаг

    не активируется. context.screens уже нормализован s02a.ds_pin; fallback

    screen_id=feature создаётся там же (см. context_contract ниже).

    '
  phase: ideation
  stage: design
  agent: orc
  track: B
  mode: all
  when:
    param: feature_profile
    in:
    - full
    - frontend
  invoke:
    sub_process: design-unit
    for_each: context.screens
    max_parallel: 3
    unit_key: screen_id
    block_on_quarantine: true
  inputs:
  - draft-feature-brief
  - scope-report
  - ds-pin
  outputs:
  - visualized-brief-units
  depends_on:
  - s02a.ds_pin
- id: s03a.design_integrate
  name: Интеграция дизайн-юнитов и DS-контракта
  description: 'Агрегирует unit''ы в единый дизайн-контракт фичи: visualized-brief,

    design-impact.md, ds.lock.json, component-refs.json, component-map.yaml,

    design-review.fragment.json, design-gaps.json. Проверяет полноту экранов,

    совпадение design_system_version/ds_digest у всех unit''ов, единственность

    ds.lock.json, отсутствие конфликтов component-map и согласованность

    design-gaps с component-refs.path6_required. s04 зависит от этого шага.

    '
  phase: ideation
  stage: design
  agent: architect
  track: B
  mode: all
  when:
    param: feature_profile
    in:
    - full
    - frontend
  artifact: design-impact.md + ds.lock.json + component-refs.json + component-map.yaml + design-gaps.json + design-review.fragment.json
  inputs:
  - visualized-brief-units
  - unit-design-gaps
  - scope-report
  - design/tokens.json
  - design/registry.json
  outputs:
  - visualized-brief
  - design-impact
  - ds-lock
  - component-refs
  - component-map
  - design-gaps
  - design-review
  depends_on:
  - s03.proto_visualize
  result_schema:
    type: object
    required:
    - visualized_brief
    - design_impact
    - ds_lock
    - component_refs
    - component_map
    - design_gaps
    - design_review
    properties:
      visualized_brief:
        type: string
      design_impact:
        type: string
      ds_lock:
        type: string
      component_refs:
        type: string
      component_map:
        type: string
      design_gaps:
        type: string
      design_review:
        type: string
- id: s03b.prototype_accept
  name: Приёмка прототипа человеком (OpenPencil/S3)
  description: 'Human-гейт качества прототипа ДО реализации. Человек открывает

    интегральный прототип в OpenPencil (S3 workspace), правит/комментирует,

    затем approve или changes_requested. При approve фиксируется снимок

    prototypes/vN: manifest.json + prototype-review.json + exports; digest

    снимка привязан к Nexus approval (subject=prototype).

    При reject — ветка на s03c.prototype_rework (affected units), затем

    s03a → s03b. s04 не стартует без approved.

    '
  phase: ideation
  stage: validation
  agent: human
  track: B
  mode: all
  when:
    param: feature_profile
    in:
    - full
    - frontend
  artifact: prototypes/vN/manifest.json + prototype-review.json + exports/*.png
  inputs:
  - visualized-brief
  - design-impact
  - ds-lock
  - component-refs
  - design-gaps
  - design-review
  outputs:
  - prototype-approved
  depends_on:
  - s03a.design_integrate
  result_schema:
    type: object
    required:
    - artifact_path
    - verdict
    - prototype_sha256
    - summary
    - context
    properties:
      artifact_path:
        type: string
      verdict:
        type: string
        enum:
        - approved
        - changes_requested
      prototype_sha256:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
      summary:
        type: object
        required:
        - blockers_open
        - majors_open
        - minors_open
        properties:
          blockers_open:
            type: integer
            minimum: 0
          majors_open:
            type: integer
            minimum: 0
          minors_open:
            type: integer
            minimum: 0
      context:
        type: object
      approval_payload:
        type: object
- id: s03c.prototype_rework
  name: Переделка прототипа по замечаниям s03b
  description: 'Переисполняет design-unit для затронутых экранов после

    changes_requested. Правки человека не теряются: unit берёт последний

    S3 .fig, а не перезаписывает его сгенерированной версией. По завершении

    invalidates сбрасывает s03a/s03b, чтобы интеграция и приёмка прошли

    заново. Версия снимка — vN+1; старый vN уходит в archive/.

    '
  phase: ideation
  stage: design
  agent: orc
  track: B
  mode: all
  when:
    param: feature_profile
    in:
    - full
    - frontend
  invoke:
    sub_process: design-unit
    for_each: context.screens
    max_parallel: 3
    unit_key: screen_id
    block_on_quarantine: true
  inputs:
  - prototype-review
  - design-impact
  outputs:
  - visualized-brief-units
  depends_on:
  - s03b.prototype_accept
  goto_only: true
  invalidates:
  - s03a.design_integrate
  - s03b.prototype_accept
- id: s04.graph_builder_design
  name: UI-граф из дизайна (graph-builder from-design)
  description: 'UI-граф из дизайна (graph-builder from-design): результат — UI-GRAPH.yaml (planned-graph). Опирается на: visualized-brief,
    scope-report. Остаётся опциональным (дизайн-граф спекулятивен); обязательна только актуализация по коду — s21.'
  phase: ideation
  stage: design
  agent: graph-builder
  track: B
  mode: subagent
  when:
    param: feature_profile
    in:
    - full
    - frontend
  artifact: UI-GRAPH.yaml (planned-graph)
  inputs:
  - visualized-brief
  - scope-report
  - design-impact
  - ds-lock
  - component-refs
  - component-map
  - design-gaps
  - prototype-approved
  - prototype-review
  outputs:
  - planned-ui-graph
  depends_on:
  - s03b.prototype_accept
  arch_writes:
  - type: create_or_update
    target: arch/frontend/pages/*.yaml
    status: planned
- id: s05.architect_validation
  name: Валидация архитектора
  phase: ideation
  stage: validation
  agent: architect
  track: infra
  mode: all
  artifact: Expertise Report (валидация)
  inputs:
  - visualized-brief
  - planned-ui-graph
  - scope-report
  - design-impact
  - ds-lock
  - component-refs
  - design-gaps
  - design-review
  outputs:
  - expertise-report
  depends_on:
  - s04.graph_builder_design
  - s02.architect_scope_analysis
  description: 'Проверка соответствия дизайна архитектурным ограничениям. ОБЯЗАТЕЛЬНО публикуй open_decisions[] — развилки,
    где сырой запрос человека допускает ≥2 прочтения (напр. неоднозначная формулировка): архитектор формулирует варианты и
    рекомендацию, но НЕ решает двусмысленность молча — она уходит на s07.requirements_reconcile как вопрос человеку. Решения
    B* давай явно и трассируемо к пункту запроса (decision_ref), чтобы переинтерпретация не спряталась.

    '
- id: s06.feature_brief_final
  name: Финализация feature-brief.md
  description: 'Финализация feature-brief.md: результат — feature-brief.md (финал). Опирается на: expertise-report. Дополнительно
    сохраняет doc/идеи/<F>/invariants.json с теми же invariants[] (id/statement/test_ref/enforcement) — файл-артефакт machine-гейтов
    (test-ref-runnable, catalog-invariants, ui-audit). Если path1.ui.json.platform ∈ {web,mobile,both} — добавь в invariants.json
    core INV-UI-TRUTH, INV-UI-LABEL, INV-UI-A11Y-NAME, INV-UI-ORACLE (формат — doc/процесс/ui-invariants.md). Статусы ядра:
    INV-UI-TRUTH/LABEL/A11Y-NAME — active с исполнимым test_ref. INV-UI-ORACLE публикуй со status `proposed`: его enforcement
    — гейты s22a (gate-ui-audit-machine) и oracle-cited s22/s24, а ui-audit.json появляется только на s22a, поэтому active-инвариант
    с test_ref на s20a недопустим (gate-invariant-enforced). Общее правило: если оракул инварианта материализуется ПОЗЖЕ (стендовый
    E2E на s20c, ui-audit.json на s22a), публикуй его со status `proposed` до этого шага — иначе active-инвариант с test_ref
    на s20a недопустим (gate-invariant-enforced). Так же публикуй INV-UI-E2E-PREVIEW (его оракул — E2E на стенде со скриншотом,
    s20c).

    '
  phase: ideation
  stage: validation
  agent: product
  track: docs
  mode: all
  artifact: feature-brief.md (финал)
  inputs:
  - expertise-report
  outputs:
  - feature-brief
  depends_on:
  - s05.architect_validation
  result_schema:
    type: object
    required:
    - invariants
    - do
    - dont
    - out_of_scope
    - change_class
    properties:
      invariants:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - id
          - statement
          - enforcement
          properties:
            id:
              type: string
            statement:
              type: string
            rationale:
              type: string
            enforcement:
              type: string
            status:
              type: string
              enum:
              - proposed
              - active
              - deprecated
            test_ref:
              type: string
      do:
        type: array
        minItems: 1
        items:
          type: string
      dont:
        type: array
        minItems: 1
        items:
          type: string
      out_of_scope:
        type: array
        items:
          type: string
      change_class:
        type: string
        enum:
        - plain
        - security
        - invariant
        - arch
- id: s07.requirements_reconcile
  name: Сверка требований «просил человек ↔ делаем» (product)
  description: 'Обязательная сверка ДО планирования (закрывает дефект E2669: гейты проверяли согласованность с самими собой,
    а не с запросом человека). product читает НЕИЗМЕНЯЕМЫЙ сырой запрос человека (context.feature_request_path или doc/идеи/<F>/feature-request.md)
    и артефакты проектирования (feature-brief, scope-report, expertise-report, visualized-brief, planned-ui-graph) и публикует
    два артефакта: (1) doc/идеи/<F>/intent-trace.json — машинный манифест items[{item_id, raw_quote, our_interpretation, verdict∈{match,reinterpreted,missing,dropped},
    decision_ref, scenario_ref, added, confirmed_by_human}] + open_questions[]; (2) doc/идеи/<F>/intent-brief.md — КОРОТКИЙ
    (1–2 экрана, НЕ спека и не план) человекочитаемый документ: цель, таблица «просил→делаем», отдельный раздел «где домыслили
    / что добавили от себя», ссылки на прототипы (s03/s04). Правила: каждый пункт сырого запроса обязан иметь запись (silent
    drop запрещён); verdict=reinterpreted или added требует явного подтверждения человеком (s08); двусмысленности из s05.open_decisions[]
    выносятся вопросами к человеку, а не решаются молча. Источник сверки — СЫРОЙ запрос, не бриф (иначе самопроверка тавтологична).

    '
  phase: ideation
  stage: validation
  agent: product
  track: docs
  mode: all
  artifact: intent-trace.json + intent-brief.md
  inputs:
  - feature-request
  - feature-brief
  - scope-report
  - expertise-report
  - visualized-brief
  - planned-ui-graph
  outputs:
  - intent-trace
  - intent-brief
  depends_on:
  - s06.feature_brief_final
  result_schema:
    type: object
    required:
    - artifact_path
    - items
    - open_questions
    - context
    properties:
      artifact_path:
        type: string
      intent_brief_path:
        type: string
      items:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - item_id
          - raw_quote
          - our_interpretation
          - verdict
          properties:
            item_id:
              type: string
            raw_quote:
              type: string
            our_interpretation:
              type: string
            verdict:
              type: string
              enum:
              - match
              - reinterpreted
              - missing
              - dropped
            decision_ref:
              type: string
            scenario_ref:
              type: string
            added:
              type: boolean
            confirmed_by_human:
              type: string
              enum:
              - true
              - false
              - edited
      open_questions:
        type: array
        items:
          type: string
      summary:
        type: object
      context:
        type: object
- id: s08.intent_brief_review
  name: Человек утверждает «что делаем» (intent-brief)
  description: 'Обязательный человеческий чекпойнт перед планированием (возврат human-in-the-loop, снятого в 2.3.0). Человек
    получает КОРОТКИЙ intent-brief.md, а не 1000 страниц брифа/плана: цель, таблица «просил→делаем», список домыслов/добавлений,
    прототипы. Решение: approved=true + signature (policy(<process>@<version> <YYYY-MM-DD>) или свободная) и/или edits[] +
    disposition. Правки человека обязаны быть внесены в intent-trace.json (confirmed_by_human=edited) и при необходимости
    в feature-brief.md ДО перехода к s10. Без человеческого решения подтверждение не фиксируется (событие l5_unsigned) — планирование
    стартовать не должно.'
  phase: ideation
  stage: validation
  agent: human
  track: docs
  mode: all
  artifact: утверждение intent-brief
  inputs:
  - intent-brief
  - intent-trace
  outputs:
  - approved-intent
  depends_on:
  - s07.requirements_reconcile
  max_retries: 5
- id: s06a.reality_snapshot
  name: Reality-snapshot (auditor; C-1)
  description: 'Снимок реального состояния кода: scope, узлы nodes[].{id,kind,ref[,run_result]}, commit, actual_behavior.
    Заземляет планирование фактом, а не текстом брифа.

    '
  phase: planning
  agent: auditor
  track: infra
  mode: subagent
  artifact: reality-snapshot
  inputs:
  - feature-brief
  outputs:
  - reality-snapshot
  depends_on:
  - s08.intent_brief_review
  result_schema:
    type: object
    required:
    - scope
    - nodes
    - commit
    - context
    properties:
      scope:
        type: string
      commit:
        type: string
      actual_behavior:
        type: string
      nodes:
        type: array
        items:
          type: object
          required:
          - id
          - kind
          - ref
          properties:
            id:
              type: string
            kind:
              type: string
            ref:
              type: string
            run_result: {}
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
- id: s06b.reconcile
  name: Reconcile-вердикт с классификацией дрейфа (architect; C-2)
  description: 'Сверка снимка с брифом/спеками: coverage{total,resolved} и divergences[] с classification ∈ doc_stale|code_bug|expectation_wrong|no_drift.

    '
  phase: planning
  agent: architect
  track: infra
  mode: all
  artifact: reconcile-verdict
  inputs:
  - reality-snapshot
  - feature-brief
  outputs:
  - reconcile-verdict
  depends_on:
  - s06a.reality_snapshot
  result_schema:
    type: object
    required:
    - coverage
    - divergences
    - context
    properties:
      coverage:
        type: object
        required:
        - total
        - resolved
        properties:
          total:
            type: integer
          resolved:
            type: integer
      divergences:
        type: array
        items:
          type: object
          required:
          - id
          - classification
          properties:
            id:
              type: string
            classification:
              type: string
              enum:
              - doc_stale
              - code_bug
              - expectation_wrong
              - no_drift
            outcome:
              type: string
            severity:
              type: string
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
- id: s06c.reconcile_verify
  name: Независимая верификация reconcile (architect ≠ auditor; C-3)
  description: 'Правило 4: кто снимал реальность (auditor), не проверяет сам себя; верификацию ведёт architect. Машинной проверки
    «разные личности» в движке нет (2.0.0) — здесь независимость обеспечивается разными агентами.

    '
  phase: planning
  agent: architect
  track: infra
  mode: all
  artifact: reconcile-verify
  inputs:
  - reconcile-verdict
  outputs:
  - reconcile-verified
  depends_on:
  - s06b.reconcile
  result_schema:
    type: object
    required:
    - verdict
    - verified_by
    - context
    properties:
      verdict:
        type: string
        enum:
        - pass
        - fail
      verified_by:
        type: string
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
- id: s06d.canonize
  name: Канонизация понятий (architect; C-4)
  description: 'Одно понятие = одно определение (term/definition/storage/version). Публикует {context.canon} — путь к артефакту-канону
    для гейта поведения (C-5).

    '
  phase: planning
  agent: architect
  track: infra
  mode: all
  artifact: canon artifact
  inputs:
  - reconcile-verified
  outputs:
  - canon
  depends_on:
  - s06c.reconcile_verify
  result_schema:
    type: object
    required:
    - artifact_path
    - canon
    - context
    properties:
      artifact_path:
        type: string
      canon:
        type: array
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
  context_updates:
    canon: '{result.artifact_path}'
    canon_meta:
      path: '{result.artifact_path}'
      terms: '{result.canon}'
- id: s06e.reproduce
  name: Прогон сценария (auditor; C-4/C-5)
  description: 'Воспроизводит сценарий из канона и публикует {context.run_result}. Command-гейт expected==actual сравнивает
    canon и run_result (C-5); без runner''а гейт активируется только overlay''ем ({context.drift_gate}).

    '
  phase: planning
  agent: auditor
  track: infra
  mode: subagent
  artifact: run-result
  inputs:
  - canon
  outputs:
  - run_result
  depends_on:
  - s06d.canonize
  result_schema:
    type: object
    required:
    - artifact_path
    - run_result
    - repro
    - context
    properties:
      artifact_path:
        type: string
      run_result: {}
      repro:
        type: object
        required:
        - test_ref
        - pre_exit_code
        - post_exit_code
        properties:
          test_ref:
            type: string
          pre_exit_code:
            type: integer
          post_exit_code:
            type: integer
          fails_before:
            type: boolean
          passes_after:
            type: boolean
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
  context_updates:
    run_result: '{result.artifact_path}'
    run_result_meta:
      path: '{result.artifact_path}'
      result: '{result.run_result}'
- id: s10.change_definition
  name: Change-definition по доменам (architect)
  description: 'Change-definition по доменам (architect): результат — change-definition.md для каждого домена. Опирается на:
    approved-feature-brief, scope-report.

    '
  phase: planning
  agent: architect
  track: infra
  mode: all
  artifact: change-definition.md для каждого домена
  inputs:
  - approved-feature-brief
  - scope-report
  - design-impact
  - ds-lock
  - component-refs
  - design-gaps
  outputs:
  - change-definitions
  depends_on:
  - s06e.reproduce
  - s08.intent_brief_review
  arch_writes:
  - type: create_or_update
    target: change-definition artifacts
- id: s11.planner_high_level
  name: Верхнеуровневый план фичи (planner mode:all)
  description: 'Верхнеуровневый план фичи (planner mode:all): результат — план в чате + plan.md. Опирается на: change-definitions,
    planned-ui-graph.

    '
  phase: planning
  agent: planner
  track: docs
  mode: all
  artifact: план в чате + plan.md
  inputs:
  - change-definitions
  - planned-ui-graph
  outputs:
  - plan-draft
  depends_on:
  - s10.change_definition
  arch_reads:
  - type: history
    target: похожие задачи из прошлых фичей
  arch_writes:
  - type: create
    target: plan artifact, task relationships
  prompt_patch: 'ДЕКОМПОЗИЦИЯ (ОБЯЗАТЕЛЬНО): один unit = ОДИН endpoint ЛИБО ОДИН экран/компонент + ЕГО тесты; запрещены «мега-юниты»;
    в каждом unit_brief — конкретные файлы, явные acceptance-оракулы, ≤ ~8 файлов.'
- id: s13.plan_save
  name: Сохранение плана в файл (planner)
  description: 'Сохранение плана в файл (planner): результат — doc/идеи/F{NN}-{slug}/plan.md. Опирается на: approved-plan.

    '
  phase: planning
  agent: planner
  track: docs
  mode: all
  artifact: doc/идеи/F{NN}-{slug}/plan.md
  inputs:
  - approved-plan
  outputs:
  - saved-plan
  depends_on:
  - s11.planner_high_level
- id: s14.spec_generation
  name: Генерация спеков (spec subagent)
  description: 'Генерация спеков (spec subagent): результат — core.md + openapi/modules/*.yaml. Опирается на: saved-plan.

    '
  phase: planning
  agent: spec
  track: A
  mode: subagent
  artifact: core.md + openapi/modules/*.yaml
  inputs:
  - saved-plan
  - change-definitions
  - ds-lock
  - component-refs
  - component-map
  - design-gaps
  outputs:
  - specs
  depends_on:
  - s13.plan_save
  result_schema:
    type: object
    required:
    - context
    - specs
    - contract_diff
    - contract_parity
    properties:
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
      specs:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - domain
          - core_path
          properties:
            domain:
              type: string
            core_path:
              type: string
            openapi_path:
              type: string
            contract_diff:
              type: object
              required:
              - added
              - removed
              - changed
              properties:
                added:
                  type: integer
                  minimum: 0
                removed:
                  type: integer
                  minimum: 0
                changed:
                  type: integer
                  minimum: 0
      contract_diff:
        type: object
        required:
        - added
        - removed
        - changed
        properties:
          added:
            type: integer
            minimum: 0
          removed:
            type: integer
            minimum: 0
          changed:
            type: integer
            minimum: 0
      contract_parity:
        type: object
        required:
        - drift_count
        - items
        properties:
          drift_count:
            type: integer
            minimum: 0
          items:
            type: array
            items:
              type: object
              properties:
                op:
                  type: string
                kind:
                  type: string
                expected:
                  type: string
                actual:
                  type: string
  context_updates:
    contract_diff: '{result.contract_diff}'
  arch_reads:
  - type: get
    target: существующие API contracts
  arch_writes:
  - type: update
    target: contract artifacts
- id: s15.brief_milestone
  name: Бриф вехи (planner subagent)
  description: 'Бриф вехи (planner subagent): результат — M{NN}/brief.md. Опирается на: saved-plan, specs. ОБЯЗАТЕЛЕН (ревизия
    2.11.11): экономия на подготовке не оправдывает риск «сделали не то»; бриф вехи фиксирует границы вехи до кода.'
  phase: planning
  agent: planner
  track: docs
  mode: subagent
  artifact: M{NN}/brief.md
  inputs:
  - saved-plan
  - specs
  outputs:
  - milestone-brief
  depends_on:
  - s14.spec_generation
  arch_writes:
  - type: create
    target: milestone artifact
- id: s16.brief_tasks
  name: Детальные брифы задач (planner subagent)
  description: 'Детальные брифы задач (planner subagent): результат — T{NNNN}/brief.md × N. Опирается на: milestone-brief,
    specs. Для change_class=plain допускается СЛИЯНИЕ брифов: один brief на unit (без отдельного milestone-брифа), Каждый
    unit_brief задаёт `sde` (роль исполнителя): frontend/* → sde-frontend, backend/* → sde-backend, infra → sde-infra, mobile/*
    → sde-mobile.

    '
  phase: planning
  agent: planner
  track: docs
  mode: subagent
  artifact: T{NNNN}/brief.md × N
  inputs:
  - milestone-brief
  - specs
  outputs:
  - task-briefs
  depends_on:
  - s15.brief_milestone
  result_schema:
    type: object
    required:
    - unit_briefs
    - context
    properties:
      unit_briefs:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - unit_id
          - domain
          - sde
          - change_class
          - scope
          - files
          properties:
            unit_id:
              type: string
              minLength: 1
            domain:
              type: string
            sde:
              type: string
              enum:
              - sde-backend
              - sde-frontend
              - sde-infra
              - sde-mobile
            change_class:
              type: string
              enum:
              - plain
              - security
              - invariant
              - arch
            scope:
              type: array
              minItems: 1
              items:
                type: string
            files:
              type: array
              items:
                type: string
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
  context_updates:
    unit_briefs: '{result.unit_briefs}'
  arch_writes:
  - type: create
    target: task artifacts с деталями
- id: s17.coverage_audit
  name: Аудит покрытия (architect)
  phase: planning
  agent: architect
  track: infra
  mode: all
  artifact: отчёт об аудите покрытия
  inputs:
  - task-briefs
  - specs
  - saved-plan
  outputs:
  - coverage-audit
  depends_on:
  - s16.brief_tasks
  max_retries: 2
  result_schema:
    type: object
    required:
    - context
    - verdict
    - gaps
    properties:
      verdict:
        type: string
        enum:
        - pass
        - pass_with_gaps
        - fail
      gaps_has_blocking:
        type: boolean
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
      gaps:
        type: array
        items:
          type: object
          required:
          - id
          - severity
          - owner
          properties:
            id:
              type: string
            severity:
              type: string
              enum:
              - info
              - minor
              - major
              - critical
            owner:
              type: string
            description:
              type: string
            check:
              type: string
      coverage:
        type: object
  description: 'КРИТИЧЕСКИЙ ГЕЙТ перед переходом к исполнению. Проверяет что spec полностью готова ко всем аспектам. Плюс
    вердикты по КАТАЛОГУ ОТКАЗОВ: сохрани doc/идеи/<F>/fault-verdicts.json — {"<catalog_id>": {"verdict":"covered|gap|na",
    "check":"…", "proof_run_id|detector_exit|evidence":"…"(covered), "justification":"…"(na/gap)}} по каждому id из audit/fault-catalog/*.
    covered без proof недопустим (вердикт на суждении); na — только с обоснованием (наследование базового инварианта и т.п.).
    Если proof унаследован из другого прогона/фичи (proof_run_id чужого прогона) — добавь inherited_from: "<feature>/<run>"
    (иначе вердикт считается недоказанным). Гейт gate-catalog-invariants (s20a) принимает na+justification вместо активного
    инварианта. ВЕРДИКТ (3.1.1): публикуй verdict ∈ {pass,pass_with_gaps,fail} и gaps[].{severity ∈ info|minor|major|critical,
    owner}; ОБЯЗАТЕЛЬНО сохрани машинное зеркало doc/идеи/<F>/coverage-audit.json {verdict, coverage{total,resolved}, gaps[{id,severity,owner,description,check}]}
    — его читает gate-coverage-verdict. Правило: verdict=fail или любой gap major/critical → гейт FAIL (в т.ч. pass_with_gaps);
    pass_with_gaps только с info/minor проходит и открывает s20; при FAIL работает ветка s17→s16 (max_cycles 2 → quarantine).
    Флаг gaps_has_blocking = true при любом gap severity major|critical — на него опирается условие ветки (правила условий
    не ищут по массиву gaps).

    '
