- id: s16.brief_tasks
  name: Детальные брифы задач (planner subagent)
  description: 'Детальные брифы задач (planner subagent): результат — T{NNNN}/brief.md × N. Опирается на: milestone-brief, specs. Для change_class=plain допускается СЛИЯНИЕ брифов: один brief на unit (без отдельного milestone-брифа), Каждый unit_brief задаёт `sde` (роль исполнителя): frontend/* → sde-frontend, backend/* → sde-backend, infra → sde-infra, mobile/* → sde-mobile.

    '
  phase: planning
