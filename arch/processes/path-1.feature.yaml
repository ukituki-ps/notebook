        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
  arch_writes:
  - type: commit_log
    target: execution log в git
- id: s45.push_primary
  name: PUSH-PRIMARY — push уже влитой ветки в primary для старта CI (C-19; opt-in)
  skippable: true
  description: 'Явный push ДО post-deploy verify: терминальная финализация срабатывает только на завершении прогона (после
    s46), поэтому без явного push CI/деплой не стартуют. Пушит в {context.push_target} (свойство проекта).

    '
  phase: acceptance
  agent: orc
  track: infra
  mode: all
  inputs: []
  outputs: []
  depends_on:
  - s24.team_lead_accept
- id: s46.post_deploy_verify
  name: POST-DEPLOY VERIFY — CI+образ+golden path по стенду (C-18; opt-in)
  skippable: true
  phase: acceptance
  agent: tester-run
  track: B
  mode: subagent
  inputs: []
  outputs:
  - post-deploy-verdict
  depends_on:
  - s45.push_primary
  result_schema:
    type: object
    required:
    - context
    - evidence
    - ci_run
    - stand_image
    - golden_path
    - outcome
    properties:
      context:
        type: object
      evidence:
        type: array
      ci_run:
        type: object
      stand_image:
        type: string
      golden_path:
        type: string
      outcome:
        type: string
        enum:
        - deploy_verified
        - deploy_failed
        - blocked_no_credentials
sub_processes:
  feature-unit:
    id: feature-unit
    params:
    - unit_id
    - sde
    - change_class
    - scope
    - files
    steps:
    - id: s10.unit_plan
      name: PLAN юнита (C-10)
      agent: planner
      track: docs
      mode: subagent
      result_schema:
        type: object
        required:
        - unit_plan
        - context
        properties:
          unit_plan:
            type: array
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on: []
    - id: s11.unit_execution
      name: DO юнита (C-10)
      agent: sde-backend
      agent_param: sde
      track: A
      mode: subagent
      result_schema:
        type: object
        required:
        - artifact_path
        - fixed_confirmed
        - context
        - evidence
        properties:
          artifact_path:
            type: string
          fixed_confirmed:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
          evidence:
            type: array
            items:
              type: object
              required:
              - id
              - command
              properties:
                id:
                  type: string
                command:
                  type: string
                evidence_id:
                  type: string
                file:
                  type: string
                line:
                  type: integer
                before:
                  type: string
                after:
                  type: string
      context_updates:
        report_path: '{result.artifact_path}'
      depends_on:
      - s10.unit_plan
    - id: s11a.arch_approve
      name: ARCH-APPROVE плана (when change_class ∈ security|invariant|arch; C-13)
      agent: architect
      track: infra
      mode: all
      when:
        param: change_class
        in:
        - security
        - invariant
        - arch
      result_schema:
        type: object
        required:
        - approved
        - context
        properties:
          approved:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s10.unit_plan
    - id: s12.unit_check
      name: CHECK юнита (C-10)
      agent: sde-backend
      agent_param: sde
      track: A
      mode: subagent
      result_schema:
        type: object
        required:
        - fixed_confirmed
        - context
        - evidence
        properties:
          fixed_confirmed:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
          evidence:
            type: array
            items:
              type: object
              required:
              - id
              - command
              properties:
                id:
                  type: string
                command:
                  type: string
                evidence_id:
                  type: string
                file:
                  type: string
                line:
                  type: integer
                before:
                  type: string
                after:
                  type: string
      depends_on:
      - s11.unit_execution
      - s11a.arch_approve
    - id: s13.unit_verify
      name: VERIFY юнита (architect ≠ executor; C-14/Правило 4)
      agent: architect
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - verdict
        - verified_by
        - context
        properties:
          verdict:
            type: string
            enum:
            - pass
            - fail
          verified_by:
            type: string
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s12.unit_check
    - id: s14.unit_quality
      name: QUALITY юнита (crutch density)
      agent: architect
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - crutch_density_grew
        - context
        properties:
          crutch_density_grew:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s13.unit_verify
    - id: s15.unit_regression
      name: REGRESSION юнита
      agent: auditor
      track: infra
      mode: subagent
      result_schema:
        type: object
        required:
        - new_findings
        - context
        properties:
          new_findings:
            type: array
            items:
              type: object
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s13.unit_verify
    - id: s16.unit_spec_sync
      name: SPEC-SYNC юнита
      agent: architect
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - synced
        - context
        properties:
          synced:
            type: boolean
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s13.unit_verify
    - id: s17.unit_verdict
      name: VERDICT юнита (machine outcome; C-14)
      agent: orc
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - outcome
        - context
        properties:
          outcome:
            type: string
            enum:
            - clean
            - not_clean
            - new_findings
          context:
            type: object
            required:
            - source
            - tokens
            properties:
              source:
                type: string
                enum:
                - orc_ctx
                - arch_ctx
              tokens:
                type: integer
              artifacts:
                type: array
                items:
                  type: string
      depends_on:
      - s14.unit_quality
      - s15.unit_regression
      - s16.unit_spec_sync
    - id: s18.unit_merge_unit
      name: MERGE_UNIT (machine merge в feature-ветку; C-14)
      agent: orc
      track: infra
      mode: all
      result_schema:
        type: object
        required:
        - merged
        properties:
          merged:
            type: boolean
      depends_on:
      - s17.unit_verdict
    gates:
      s13.unit_verify:
      - id: gate-unit-executor-distinct
        kind: executor-distinct
        layer: 1
        criteria:
        - 'baseline_step: s12.unit_check'
        on_fail:
          action: retry
          max_attempts: 2
          reason: verify-executor не отличается от executor (Правило 4)
          disposition: quarantine
      s17.unit_verdict:
      - id: gate-unit-verdict
        kind: unit-verdict
        layer: 1
        criteria:
        - 'fix_step: s12.unit_check'
        - 'fix_field: fixed_confirmed'
        - 'quality_step: s14.unit_quality'
        - 'quality_field: crutch_density_grew'
        - 'regression_step: s15.unit_regression'
        - 'regression_field: new_findings'
        - 'spec_sync_step: s16.unit_spec_sync'
        - 'spec_sync_field: synced'
        on_fail:
          action: retry
          max_attempts: 2
          reason: unit outcome не подтверждён машиной (не-clean)
          disposition: quarantine
      s18.unit_merge_unit:
      - id: gate-unit-merge
        kind: merge-unit
        layer: 1
        criteria:
        - 'branch: {context.parent_work_branch}'
        on_fail:
          action: retry
          max_attempts: 2
          reason: machine merge юнита в feature-ветку не выполнен
          disposition: quarantine
    branches:
    - from: s13.unit_verify
      condition: s13.unit_verify.verdict == 'fail'
      target_step: s11.unit_execution
      max_cycles: 2
      on_exhausted: quarantine
    - from: s17.unit_verdict
      condition: s17.unit_verdict.outcome == 'not_clean'
      target_step: s10.unit_plan
      max_cycles: 2
      on_exhausted: quarantine
    - from: s11a.arch_approve
      when:
        param: change_class
        in:
        - security
        - invariant
        - arch
      condition: s11a.arch_approve.approved != 'true'
      target_step: s10.unit_plan
      max_cycles: 2
      on_exhausted: quarantine
    - from: s12.unit_check
      when:
        param: change_class
        in:
        - security
        - invariant
        - arch
      condition: s11a.arch_approve.approved != 'true'
      target_step: s10.unit_plan
      max_cycles: 2
      on_exhausted: quarantine
  design-unit:
    id: design-unit
    params:
    - screen_id
    - screen_brief
    - platform
    - feature_profile
    - design_system_version
    - ds_digest
    steps:
    - id: s03.unit_proto
      name: Прототип экрана + state matrix
      description: 'Рисует экран (ASCII/прототип) и публикует state matrix: normal,

        loading, empty, error + доменные состояния из screen_brief.

        Каждый узел помечается node_id для component-map.

        '
      phase: ideation
      stage: design
      agent: proto
      track: B
      mode: subagent
      artifact: unit-proto (ASCII/прототип + state matrix)
      inputs:
      - draft-feature-brief
      - scope-report
      - screen_brief
      outputs:
      - unit-proto
      depends_on: []
    - id: s04a.unit_ds_resolve
      name: Резолв DS-релиза и component-map экрана
      description: 'Резолвит точную версию DS (design/releases/<v>/manifest.json),

        проверяет design_system_version/ds_digest и tokens/registry hashes,

        строит component-map: proto-node → registry_id, публикует

        unit-предложение ds.lock и unit-design-gaps. Не редактирует DS.

        '
      phase: ideation
      stage: design
      agent: designer
      track: B
      mode: subagent
      artifact: unit-ds-lock + component-map + component-refs (unit)
      inputs:
      - unit-proto
      - design_system_version
      - ds_digest
      - design/tokens.json
      - design/registry.json
      outputs:
      - unit-ds-lock
      - component-map
      - component-refs-unit
      - unit-design-gaps
      depends_on:
      - s03.unit_proto
    - id: s03.unit_ui_review
      name: UI-ревью unit'а (designer, независимый)
      description: 'Проверяет визуальную систему, токены, состояния компонентов,

        композицию, адаптив и a11y-механику. Автор proto не может быть

        ревьюером: reviewer_session_id != author_session_id.

        '
      phase: ideation
      stage: validation
      agent: designer
      track: B
      mode: subagent
      artifact: design-review.fragment.json (ui)
      inputs:
      - unit-proto
      - unit-ds-lock
      - component-map
      outputs:
      - unit-ui-review
      depends_on:
      - s03.unit_proto
      - s04a.unit_ds_resolve
    - id: s03.unit_ux_review
      name: UX-ревью unit'а (product/UX, независимый)
      description: 'Проверяет задачу пользователя, IA, тексты, flow, восстановление после

        ошибок и доменную честность (unknown != 0, blocked, over-budget).

        Автор proto не может быть ревьюером.

        '
      phase: ideation
      stage: validation
      agent: product
      track: docs
      mode: subagent
      artifact: design-review.fragment.json (ux)
      inputs:
      - unit-proto
      - component-map
      - draft-feature-brief
      outputs:
      - unit-ux-review
      depends_on:
      - s03.unit_proto
    gates:
      s03.unit_proto:
      - id: gate-unit-proto-coverage
        kind: command
        layer: 1
        command: bash tools/path1-gate.sh unit-proto-coverage {execution_id} --screen {screen_id}
        criteria:
        - every state from screen_brief is covered by proto/state matrix
        - no unlabeled/unknown state; domain states (blocked/over-budget/offline) are explicit
        - each proto node has a component-map entry or a path6-required entry
        on_fail:
          action: retry
          max_attempts: 2
          disposition: quarantine
          reason: proto не покрывает состояния экрана или оставляет узлы без component-map
        x-status: proposed
      s04a.unit_ds_resolve:
      - id: gate-unit-ds-lock
        kind: command
        layer: 1
        command: bash tools/path1-gate.sh unit-ds-lock {execution_id} --screen {screen_id}
        criteria:
        - ds.lock proposal resolves to design/releases/<v>/manifest.json
        - constraint is exact (=X.Y.Z); ranges/latest/main/dev are rejected
        - design_system_version and ds_digest match the manifest and unit params
        - tokens_sha256/registry_sha256/kit_sha256 match the manifest
        - feature branch does not modify design/** or frontend/src/ui/**
        on_fail:
          action: retry
          max_attempts: 2
          disposition: quarantine
          reason: 'DS lock не доказан: версия не точная, manifest/hash не совпал или DS отредактирован в feature-ветке'
        x-status: proposed
      s03.unit_ui_review:
      - id: gate-unit-ui-review
        kind: command
        layer: 4
        command: bash tools/path1-gate.sh design-review {execution_id} --kind ui
        criteria:
        - UI review artifact verdict = accept
        - reviewer_session_id != author_session_id
        - blockers = 0
        on_fail:
          action: retry
          max_attempts: 2
          disposition: escalate
          reason: UI-ревью unit'а не принято или выполнено автором
        x-status: proposed
      s03.unit_ux_review:
      - id: gate-unit-ux-review
        kind: command
        layer: 4
        command: bash tools/path1-gate.sh design-review {execution_id} --kind ux
        criteria:
        - UX review artifact verdict = accept
        - reviewer_session_id != author_session_id
        - blockers = 0
        on_fail:
          action: retry
          max_attempts: 2
          disposition: escalate
          reason: UX-ревью unit'а не принято или выполнено автором
        x-status: proposed
gates:
  s06a.reality_snapshot:
  - id: gate-snapshot-freshness
    kind: freshness
    layer: 1
    criteria:
    - 'commit_key: commit'
    - 'head_ref: HEAD'
    on_fail:
      action: retry
      max_attempts: 2
      reason: снимок не пиннится к коммиту (freshness)
      disposition: quarantine
  - id: gate-snapshot-no-drift-proof
    kind: no-drift-proof
    layer: 1
    criteria:
    - 'scope_key: scope'
    - 'nodes_key: nodes'
    - 'node_kinds: all'
    on_fail:
      action: retry
      max_attempts: 2
      reason: не доказана полнота снимка (scope/nodes/ref/run_result)
      disposition: quarantine
  s06b.reconcile:
  - id: gate-reconcile-coverage
    kind: coverage
    layer: 1
    criteria:
    - 'total_key: coverage.total'
    - 'resolved_key: coverage.resolved'
    - 'divergences_key: divergences'
    on_fail:
      action: retry
      max_attempts: 2
      reason: не каждая дивергенция покрыта вердиктом (coverage)
      disposition: quarantine
  - id: gate-reconcile-finding-block
    kind: finding-block
    layer: 1
    criteria:
    - 'divergences_key: divergences'
    - 'scope: process'
    - 'max_open_critical_high: 0'
    on_fail: escalate
  s06c.reconcile_verify:
  - id: gate-reconcile-verify
    kind: agent
    layer: 4
    criteria:
    - verifier (architect) ≠ snapshot author (auditor)
    - независимая перепроверка классификации дрейфа
  - id: gate-rule4-executor-distinct
    kind: executor-distinct
    layer: 1
    criteria:
    - 'baseline_step: s06a.reality_snapshot'
    - 'snapshot_actor_key: author'
    - 'verify_actor_key: verified_by'
    on_fail:
      action: retry
      max_attempts: 2
      reason: verify-executor не отличается от snapshot-executor (Правило 4)
      disposition: quarantine
  s06e.reproduce:
  - id: gate-drift-expected-actual
    kind: command
    layer: 1
    command: '{context.drift_gate} verify --expected {context.canon} --actual {context.run_result}'
    require_exit_zero: true
    on_fail:
      action: retry
      max_attempts: 2
      reason: 'expected != actual: сделали не то, что описали (C-5)'
      disposition: quarantine
  - id: gate-repro-first
    kind: repro-first
    layer: 1
    criteria:
    - 'repro_key: repro'
    - 'pre_key: pre_exit_code'
    - 'post_key: post_exit_code'
    - 'test_ref_key: test_ref'
    - 'allow_missing_before: true'
    on_fail:
      action: retry
      max_attempts: 2
      reason: нет доказательства «падает до / проходит после» (F165 D6)
      disposition: quarantine
  s06.feature_brief_final:
  - id: gate-invariant-present
    kind: invariant-present
    layer: 1
    criteria:
    - 'invariants_key: invariants'
    - 'min: 1'
    - 'require_test_ref_for: active'
    on_fail:
      action: retry
      max_attempts: 2
      reason: в брифе нет invariants[] или у active-инварианта нет test_ref (F165 D9)
      disposition: quarantine
  - id: gate-test-ref-runnable
    kind: command
    layer: 1
    command: bash tools/path1-gate.sh test-ref-runnable
    criteria:
    - каждый active-инвариант имеет исполнимо-опровержимый test_ref (ADR-KIT-090 A2)
    on_fail: retry
  s07.requirements_reconcile:
  - id: gate-requirement-trace
    kind: command
    layer: 1
    command: bash tools/path1-gate.sh requirement-trace {execution_id}
    criteria:
    - каждый пункт сырого запроса покрыт записью items[]; verdict=reinterpreted/added без confirmed_by_human → fail-close
      (F190 C-22)
    on_fail: retry
  s08.intent_brief_review:
  - id: gate-intent-review-approval
    kind: approval
    layer: 5
    subject: brief
    profile: blob
    target: '{context.feature_dir}/intent-brief.md'
    criteria:
    - 'approval_ref: {context.approval_ref}'
    - 'paths: doc/идеи/**,doc/**'
    on_fail: escalate
  s10.change_definition:
  - id: gate-change-def-exists
    kind: artifact-exists
    layer: 1
    target: '{feature_id}/change-definition'
    on_fail: escalate
  - id: gate-change-def-schema
    kind: schema-valid
    layer: 2
    target: '{feature_id}/change-definition'
    target_type: change-definition
    on_fail: escalate
  s13.plan_save:
  - id: gate-plan-md-exists
    kind: artifact-exists
    layer: 1
    target: '{feature_id}/plan.md'
    on_fail: retry
  s14.spec_generation:
  - id: gate-spec-core-exists
    kind: artifact-exists
    layer: 1
    on_fail: retry
    target: '{feature_id}/spec/core.md'
  - criteria:
    - 'source: orc_ctx|arch_ctx'
    - 'min_tokens: 1'
    - 'max_tokens: 15000'
    - 'require_artifacts: true'
    - 'require_evidence: false'
    - 'require_command: false'
    id: ctx-manifest
    kind: context-manifest
    layer: 1
    on_fail:
      action: retry
      disposition: quarantine
      max_attempts: 2
      reason: s14 без манифеста контекста (orc_ctx + result.context{source,tokens,artifacts})
  - criteria:
    - 'drift_key: contract_parity.drift_count'
    - 'items_key: contract_parity.items'
    - 'max_drift: 5'
    - 'allow_ids: T-18,T-20,T-25,T-26,T-27'
    - 'spec_glob: openapi/modules/*.yaml'
    - 'code_root: .'
    - 'generated_dir: internal/api/generated'
    id: gate-contract-diff-present
    kind: contract-sync
    layer: 2
    on_fail:
      action: retry
      disposition: quarantine
      max_attempts: 2
      reason: s14 не предъявил contract_diff/parity (F165 D10/D5)
  - command: python3 tools/check-contract-matrix.py --root .
    id: gate-contract-matrix
    kind: command
    layer: 1
    on_fail:
      action: retry
      disposition: quarantine
      max_attempts: 1
      reason: спеке не хватает контракт-матрицы
  s16.brief_tasks: []
  s17.coverage_audit:
  - id: gate-coverage-report
    kind: schema-valid
    layer: 2
    on_fail: escalate
    target: '{feature_id}/coverage-audit.md'
    target_type: decision
