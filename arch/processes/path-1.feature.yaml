- id: s21.graph_actualize
  name: Актуализация UI-графа (graph-builder from-code)
  description: 'Актуализация UI-графа (graph-builder from-code): результат — UI-GRAPH.yaml (актуализированный). Опирается на: implementation. ОБЯЗАТЕЛЕН для UI-фич (platform web|mobile|both): гейт gate-graph-actualized на s21 и на s24 не даёт принять UI-фичу без актуализированного графа. Для backend-only фич не требуется (гейт PASS-NA).'
