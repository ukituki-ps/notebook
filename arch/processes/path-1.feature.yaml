id: path-1.feature
name: Path 1 — Feature Development
version: 3.2.2
path_type: feature
enabled: true
max_parallel: 3
description: 'Версия 3.1.14 (PATCH; 2026-10-29; E2478): s24a.branch_fresh зависит от s22b.red_team_audit + s22c.adversarial_code_review — branch guard не может идти впереди обязательных ревью. • Версия 3.1.9 (PATCH; 2026-10-26; base absorbs stands-lease@1.2.0 + verification-hardening@1.11.0; D-1/D-2/D-3 fixed): • s19.stand_lease, s20b.preview_deploy, s20c.preview_verify, s22b.red_team_audit, s22c.adversarial_code_review теперь в базе (не оверлеями). • D-1: s20.sde_execution зависит от s17.coverage_audit + s19.stand_lease. • D-2: s22a.ui_audit и s22d.mobile_probe зависят от s20a.unit_integrate + s20c.preview_verify. • D-3: s22.result_audit зависит от s22a.ui_audit + s22d.mobile_probe + s20c.preview_verify (backend больше не обходит preview). • s22b ← s22.result_audit; s22c ← s22b + s20c; s23 ← s22.result_audit (не разорвано); s24 ← s23 + s24a + s22c. • Гейты stands-lease (s19/s20/s24), verification-hardening (s14/s17/s20/s20b/s20c/s22b/s22c/s24) и testing-stands (s20a/s24) смержены в базу без ослабления: s24 — 15 гейтов, s22b — 4, s22c — 1, s20c — 1. • Prompt-патчи verification-hardening (s11/s20/s22b/s22c) перенесены в шаги базы. • Для проектов, где stands-lease/verification-hardening были оверлеями, оверлеи подлежат deprecation (миграция: оставить только testing-stands; иначе дубли шагов). • Entry points, sub_processes feature-unit, branches и escalations — без изменений. 3.1.10 (PATCH): s05.architect_validation depends on s02.architect_scope_analysis (skip-chain s02→s03/s04→s05 fixed).

  3.1.12 (PATCH): portable gate tooling for app-repo layout — gate-l1-unit и check-integration-on-stand определяют module root по path1.project.json (detectors.go_roots), выполняют go из backend с GOWORK=off; шаги/гейты/семантика не изменены.'
owner: architect
created_at: '2026-08-18T00:00:00Z'
updated_at: '2026-10-28T10:31:40Z'
entry_points:
- id: accept
  description: Финальная приёмка (s24) без исполнения/превью
  start_from: s24.team_lead_accept
  required_context:
  - work_branch
  skip_steps:
  - s19.stand_lease
  - s20b.preview_deploy
  - s20c.preview_verify
  - s21.graph_actualize
  - s22a.ui_audit
  - s22d.mobile_probe
  - s24a.branch_fresh
  - s45.push_primary
  - s46.post_deploy_verify
- id: integrate
  description: Интеграция уже смерженных юнитов (s20a) без fan-out
  start_from: s20a.unit_integrate
  required_context:
  - work_branch
  skip_steps:
  - s24a.branch_fresh
  - s45.push_primary
  - s46.post_deploy_verify
- id: default
  description: Полный цикл начиная с s01.product_discuss
  start_from: s01.product_discuss
  required_context:
  - work_branch
  skip_steps:
  - s06a.reality_snapshot
  - s06b.reconcile
  - s06c.reconcile_verify
  - s06d.canonize
  - s06e.reproduce
  - s24a.branch_fresh
  - s45.push_primary
  - s46.post_deploy_verify
- id: after_s00
  description: Идея зафиксирована человеком, старт со s01.product_discuss (алиас default после снятия s00.idea_capture)
  start_from: s01.product_discuss
  required_context:
  - work_branch
  skip_steps:
  - s06a.reality_snapshot
  - s06b.reconcile
  - s06c.reconcile_verify
  - s06d.canonize
  - s06e.reproduce
  - s24a.branch_fresh
  - s45.push_primary
  - s46.post_deploy_verify
- id: after_s01
  description: Обсуждение с product завершено, есть feature-brief. Старт со s02.architect_scope_analysis
  start_from: s02.architect_scope_analysis
  skip_steps:
  - s01.product_discuss
  - s06a.reality_snapshot
  - s06b.reconcile
  - s06c.reconcile_verify
  - s06d.canonize
  - s06e.reproduce
