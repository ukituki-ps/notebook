      reason: 'DS pin не доказан: нет approved версии/digest, screens пуст без fallback или дубли screen_id'
    x-status: proposed
  s03b.prototype_accept:
  - id: gate-prototype-accept
    kind: command
    layer: 5
    command: bash tools/path1-gate.sh prototype-accept {execution_id}
    criteria:
    - prototypes/vN/manifest.json and prototype-review.json exist and match their schemas
    - review.prototype.manifest_sha256 equals sha256(manifest.json)
    - every manifest.document sha256 equals .fig-cache/<document_id>.fig (approved S3 object materialized)
    - review.verdict.status = approved
    - review.summary.blockers_open = 0 and majors_open = 0; no open blocker/major items
    - Nexus approval subject=prototype binds the reviewed fig/manifest digest
    - UI/UX unit reviews have reviewer_session_id != author_session_id
    on_fail:
      action: retry
      max_attempts: 3
      disposition: escalate
      reason: прототип не принят человеком или digest/blockers не совпадают
    x-status: proposed
  - id: gate-prototype-human-approval
    kind: approval
    layer: 5
    subject: prototype
    on_fail: reject
    profile: payload
  s22e.ux_audit:
  - id: gate-ux-audit
    kind: command
    layer: 1
    command: bash tools/path1-gate.sh ux-audit {execution_id}
    criteria:
    - ux-audit.json matches its schema
    - stand.sha equals the deployed ref from preview-deploy.json
    - independence.distinct = true and auditor_session_id != author_session_id
    - summary.open_critical_high = 0
    - every item has a runnable oracle and evidence
    on_fail:
      action: retry
      max_attempts: 2
      disposition: quarantine
      reason: 'UX-аудит не доказан: схема/независимость/оракул/привязка к стенду'
    x-status: proposed
  s03a.design_integrate:
  - id: gate-design-integrate
    kind: command
    layer: 2
    command: bash tools/path1-gate.sh design-integrate {execution_id}
    criteria:
    - every screen from context.screens produced a design-unit result
    - all units share the same design_system_version and ds_digest
    - exactly one feature ds.lock.json is emitted; conflicting unit versions fail
    - component-refs.json and component-map.yaml agree on node_id/registry_id
    - design-review.fragment.json contains both UI and UX verdicts for every screen
    - design-impact.md front matter matches ds.lock and component-refs
    - design-gaps.json matches component-refs.path6_required and design-impact.path6_requests
    on_fail:
      action: escalate
      reason: дизайн-юниты не агрегируются в единый DS-контракт фичи
    x-status: proposed
branches:
- from: s17.coverage_audit
  condition: s17.coverage_audit.verdict == 'fail' OR (s17.coverage_audit.verdict == 'pass_with_gaps' AND s17.coverage_audit.gaps_has_blocking
    == 'true')
  target_step: s16.brief_tasks
  priority: 2
  max_cycles: 2
  on_exhausted: quarantine
- condition: s22.result_audit == 'fail' AND retry_count < 2
  target_step: s23.refinement
  priority: 1
  max_cycles: 2
  on_exhausted: quarantine
- condition: retry_count >= 2
  target_step: escalation
  priority: 0
- from: s03b.prototype_accept
  condition: s03b.prototype_accept.verdict == 'changes_requested'
  target_step: s03c.prototype_rework
  priority: 2
  max_cycles: 3
  on_exhausted: quarantine
escalations:
- problem_type: architectural
  trigger_after_retries: 2
  route_to: architect
  severity_threshold: high
  description: 'Design violations, cross-domain impacts, pattern mismatches.

    '
- problem_type: scope
  trigger_after_retries: 1
  route_to: architect
  severity_threshold: critical
  description: 'Scope changes beyond feature boundary. Architect оценивает влияние и принимает решение.

    '
- problem_type: quality
  trigger_after_retries: 2
  route_to: team-lead
  severity_threshold: high
  description: 'Performance degradation, code smells, maintainability concerns.

    '
monitoring:
  enabled: true
  metrics_tracked:
  - step_duration_seconds
  - total_execution_time
  - waiting_for_resources_ms
  - idle_time_between_steps
  alerts_only_when:
    process_halted:
      condition: no_activity_for_5min AND not_waiting_for_resource
      action: notify_team_lead
    resource_contention_detected:
      condition: queue_length > threshold
      action: log_and_monitor
  NO_AUTO_ESCALATION:
    policy: monitor_and_log_only
    rationale: 'Агенты могут легитимно ждать доступ к GPU/CPU ресурсам. Автоматическая эскалация по времени приведёт к false
      positives. Время — это контекст для человека принимающего решение, но НЕ триггер для автоматических действий.

      '
conflict_policy:
  default_strategy: serialize
  timeout_seconds: 300
  on_timeout:
    action: notify_team_lead
    message: Resource conflict resolution timeout exceeded
runtime_branches: true
