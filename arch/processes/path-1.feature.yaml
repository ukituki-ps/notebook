      artifact_path:
        type: string
      new_findings:
        type: array
      divergent:
        type: array
        items:
          type: object
          required:
          - id
          properties:
            id:
              type: string
            kind:
              type: string
            expected:
              type: string
            actual:
              type: string
      counts:
        type: object
        properties:
          model:
            type: integer
          code:
            type: integer
          drifted:
            type: integer
          baseline:
            type: integer
          delta:
            type: integer
      contract_parity:
        type: object
        required:
        - drift_count
        - items
        properties:
          drift_count:
            type: integer
            minimum: 0
          items:
            type: array
            items:
              type: object
              properties:
                op:
                  type: string
                kind:
                  type: string
                expected:
                  type: string
                actual:
                  type: string
      context:
        type: object
        required:
        - source
        - tokens
        properties:
          source:
            type: string
            enum:
            - orc_ctx
            - arch_ctx
          tokens:
            type: integer
          artifacts:
            type: array
            items:
              type: string
      evidence:
        type: array
        items:
          type: object
          required:
          - id
          - command
          properties:
            id:
              type: string
            command:
              type: string
            evidence_id:
              type: string
            file:
              type: string
            line:
              type: integer
            before:
              type: string
            after:
              type: string
  context_updates:
    report_path: '{result.artifact_path}'
  description: 'Агрегирует результаты юнитов в сводный отчёт, проверяет совместность и публикует report_path для downstream-гейтов. Универсальный агент определяет режим автоматически; полный контекст — через arch_ctx.

    '
  arch_reads:
  - type: ctx
    target: полный контекст задачи через push-package pattern
  arch_writes:
  - type: update_status
    target: task status, reports
- agent: orc
  depends_on:
