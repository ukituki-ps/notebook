id: path-1.feature
name: Path 1 — Feature Development
version: 4.0.0
path_type: feature
enabled: true
max_parallel: 3
description: 'Версия 3.1.14 (PATCH; 2026-10-29; E2478): s24a.branch_fresh зависит от s22b.red_team_audit + s22c.adversarial_code_review
  — branch guard не может идти впереди обязательных ревью. • Версия 3.1.9 (PATCH; 2026-10-26; base absorbs stands-lease@1.2.0
  + verification-hardening@1.11.0; D-1/D-2/D-3 fixed): • s19.stand_lease, s20b.preview_deploy, s20c.preview_verify, s22b.red_team_audit,
  s22c.adversarial_code_review теперь в базе (не оверлеями). • D-1: s20.sde_execution зависит от s17.coverage_audit + s19.stand_lease.
  • D-2: s22a.ui_audit и s22d.mobile_probe зависят от s20a.unit_integrate + s20c.preview_verify. • D-3: s22.result_audit зависит
  от s22a.ui_audit + s22d.mobile_probe + s20c.preview_verify (backend больше не обходит preview). • s22b ← s22.result_audit;
  s22c ← s22b + s20c; s23 ← s22.result_audit (не разорвано); s24 ← s23 + s24a + s22c. • Гейты stands-lease (s19/s20/s24),
  verification-hardening (s14/s17/s20/s20b/s20c/s22b/s22c/s24) и testing-stands (s20a/s24) смержены в базу без ослабления:
  s24 — 15 гейтов, s22b — 4, s22c — 1, s20c — 1. • Prompt-патчи verification-hardening (s11/s20/s22b/s22c) перенесены в шаги
  базы. • Для проектов, где stands-lease/verification-hardening были оверлеями, оверлеи подлежат deprecation (миграция: оставить
  только testing-stands; иначе дубли шагов). • Entry points, sub_processes feature-unit, branches и escalations — без изменений.
  3.1.10 (PATCH): s05.architect_validation depends on s02.architect_scope_analysis (skip-chain s02→s03/s04→s05 fixed).

  3.1.12 (PATCH): portable gate tooling for app-repo layout — gate-l1-unit и check-integration-on-stand определяют module
  root по path1.project.json (detectors.go_roots), выполняют go из backend с GOWORK=off; шаги/гейты/семантика не изменены.


  4.0.0 (MAJOR): design-system pin/fan-out, s03a/s03b/s03c, UI/UX split, prototype human gate. Дизайн-система становится версионируемым
  артефактом: s02a.ds_pin фиксирует

  approved design_system_version/ds_digest и нормализует screens[] до fan-out;

  s03.proto_visualize превращается в fan-out-контейнер design-unit по экранам; внутри unit

  добавляется НОВЫЙ шаг s04a.unit_ds_resolve (в path-1 3.2.2 шага s04a нет —

  это ADD, не merge); добавляется s03a.design_integrate; UI- и UX-аудит

  разделяются на s22a.ui_audit и s22e.ux_audit; s04 зависит от s03a;

  s22.result_audit зависит от обоих аудитов; s24 получает gate-ds-drift.

  Версия MAJOR: меняются семантика/выходы s03 и s22a, добавляются обязательные

  s03a/s22e, новые гейты на s20a/s21/s24. Требуется human_checkpoint.'
