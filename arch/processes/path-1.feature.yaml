- id: s14.spec_generation
  name: Генерация спеков (spec subagent)
  description: 'Генерация спеков (spec subagent): результат — core.md + openapi/modules/*.yaml. Опирается на: saved-plan.

    '
  phase: planning
  agent: spec
  track: A
