  phase: acceptance
  prompt_patch: 'АДВЕРСАРИАЛЬНОЕ КОД-РЕВЬЮ (не отчётов). Обязан идти на ДРУГОЙ модели, чем автор. МОДЕЛЬ-ПОЛИТИКА (ADR-KIT-090
    model-distinct, дешёвая кросс-пара — БЕЗ DeepSeek V4 Pro): если автор кода = `deepseek/deepseek-flash` (V4.1 Flash) →
    проверяющий = `llama-proxy/qwen3.8-fast`; если автор кода = `llama-proxy/qwen3.8-fast` → проверяющий = `deepseek/deepseek-flash`.
    В артефакте укажи `reviewer{model,provider}`, `author_model`, `author_provider` — гейт `gate-code-review` сверит кросс-пару
    по `tools/model-policy.json` и упадёт при одном провайдере/модели. Запускай reviewer только на localhost:8090 (llama-proxy)
    или provider deepseek; V4 Pro не использовать по умолчанию. Читай `git diff <base>...HEAD` и САМ КОД; локально запускай
    go build/vet/test, tsc/vitest; сверяй spec/openapi/common.yaml с фактическим поведением; форензика evidence. Ищи реальные
    дефекты: off-by-one, dead-end состояния, scope/RLS mismatch, дрейф контракта, утечки, мёртвый код. Read-only. Артефакт
    doc/идеи/<F>/code-review.json.  НЕЗАВИСИМОСТЬ (ADR-KIT-090, E9236): шаг исполняет РАЗОВЫЙ независимый агент-ревьюер (НЕ
