          - core_path
          properties:
            domain:
              type: string
            core_path:
              type: string
            openapi_path:
              type: string
            contract_diff:
              type: object
              required:
              - added
              - removed
              - changed
              properties:
                added:
                  type: integer
                  minimum: 0
                removed:
                  type: integer
                  minimum: 0
                changed:
                  type: integer
                  minimum: 0
      contract_diff:
        type: object
        required:
        - added
        - removed
        - changed
        properties:
          added:
            type: integer
            minimum: 0
          removed:
            type: integer
            minimum: 0
          changed:
            type: integer
            minimum: 0
      contract_parity:
        type: object
        required:
        - drift_count
        - items
        properties:
          drift_count:
            type: integer
            minimum: 0
          items:
            type: array
            items:
              type: object
              properties:
                op:
                  type: string
                kind:
                  type: string
                expected:
                  type: string
                actual:
                  type: string
  context_updates:
