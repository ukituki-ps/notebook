      max_attempts: 2
      reason: canary-контур не отработал (детекторы/DSN/PATH) — доказательства ревью недостоверны
  - command: bash /opt/gate-tools/tools/path1-gate.sh canary {execution_id}
    id: gate-canary
    kind: command
    layer: 1
    on_fail:
      action: retry
      disposition: quarantine
      max_attempts: 2
      reason: канарейки не найдены
  - command: bash tools/path1-gate.sh fault-catalog
    id: gate-fault-catalog
    kind: command
    layer: 1
    on_fail:
      action: retry
      disposition: quarantine
      max_attempts: 2
      reason: неразобранные пункты каталога
  - command: bash tools/path1-gate.sh fault-catalog-exec {execution_id}
    id: gate-fault-catalog-exec
    kind: command
    layer: 1
    on_fail:
      action: retry
      disposition: quarantine
      max_attempts: 2
      reason: детектор каталога не исполняется
  - command: bash tools/path1-gate.sh catalog-invariants
    id: gate-catalog-invariants
    kind: command
    layer: 1
    on_fail:
      action: refine
      refine_step: s23.refinement
      max_refine_cycles: 2
  s22c.adversarial_code_review:
  - command: bash tools/check-code-review.sh
    id: gate-code-review
    kind: command
    layer: 1
    on_fail:
      action: refine
      refine_step: s23.refinement
      max_refine_cycles: 2
  - command: bash tools/path1-gate.sh catalog-invariants
    id: gate-catalog-invariants
    kind: command
    layer: 1
    on_fail:
      action: retry
      disposition: quarantine
      max_attempts: 2
      reason: high/critical каталога не покрыты инвариантами
branches:
- from: s17.coverage_audit
  condition: s17.coverage_audit.verdict == 'fail' OR (s17.coverage_audit.verdict == 'pass_with_gaps' AND s17.coverage_audit.gaps_has_blocking == 'true')
  target_step: s16.brief_tasks
  priority: 2
  max_cycles: 2
  on_exhausted: quarantine
- condition: s22.result_audit == 'fail' AND retry_count < 2
  target_step: s23.refinement
  priority: 1
  max_cycles: 2
  on_exhausted: quarantine
- condition: retry_count >= 2
  target_step: escalation
  priority: 0
escalations:
- problem_type: architectural
  trigger_after_retries: 2
  route_to: architect
  severity_threshold: high
  description: 'Design violations, cross-domain impacts, pattern mismatches.

    '
- problem_type: scope
  trigger_after_retries: 1
  route_to: architect
  severity_threshold: critical
  description: 'Scope changes beyond feature boundary. Architect оценивает влияние и принимает решение.

    '
- problem_type: quality
  trigger_after_retries: 2
  route_to: team-lead
  severity_threshold: high
  description: 'Performance degradation, code smells, maintainability concerns.

    '
monitoring:
  enabled: true
  metrics_tracked:
  - step_duration_seconds
  - total_execution_time
  - waiting_for_resources_ms
  - idle_time_between_steps
  alerts_only_when:
    process_halted:
      condition: no_activity_for_5min AND not_waiting_for_resource
      action: notify_team_lead
    resource_contention_detected:
      condition: queue_length > threshold
      action: log_and_monitor
  NO_AUTO_ESCALATION:
    policy: monitor_and_log_only
    rationale: 'Агенты могут легитимно ждать доступ к GPU/CPU ресурсам. Автоматическая эскалация по времени приведёт к false positives. Время — это контекст для человека принимающего решение, но НЕ триггер для автоматических действий.

      '
conflict_policy:
  default_strategy: serialize
  timeout_seconds: 300
  on_timeout:
    action: notify_team_lead
    message: Resource conflict resolution timeout exceeded
